<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>真实草原 · 体积云 · 动态天气</title>
  <style>
    body { margin:0; overflow:hidden; font-family:'Segoe UI',sans-serif; touch-action:none; }
    #hud { position:absolute; top:20px; left:20px; color:#fff; text-shadow:1px 1px 4px rgba(0,0,0,0.7); pointer-events:none; background:rgba(0,0,0,0.4); padding:8px 15px; border-radius:8px; backdrop-filter:blur(5px); font-size:14px; }
    #teleport { position:absolute; top:20px; right:20px; color:#fff; background:rgba(0,0,0,0.5); padding:12px 18px; border-radius:10px; backdrop-filter:blur(8px); display:flex; gap:8px; align-items:center; }
    #teleport input { width:80px; padding:5px; border-radius:5px; border:none; }
    #teleport button { padding:5px 15px; border-radius:5px; border:none; background:#4a90d9; color:#fff; cursor:pointer; font-weight:bold; }
    #controls { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.5); padding:12px 25px; border-radius:12px; color:#fff; display:flex; gap:20px; flex-wrap:wrap; align-items:center; backdrop-filter:blur(8px); }
    #controls select, #controls input { font-size:14px; }
    label { font-size:14px; display:flex; align-items:center; gap:5px; }

    /* 摇杆 */
    #stick-left, #stick-right { position:absolute; bottom:120px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,0.1); border:2px solid rgba(255,255,255,0.3); touch-action:none; pointer-events:auto; }
    #stick-left { left:30px; }
    #stick-right { right:30px; }
    .thumb { position:absolute; width:50px; height:50px; border-radius:50%; background:rgba(255,255,255,0.5); top:35px; left:35px; pointer-events:none; transition:none; }
  </style>
</head>
<body>
  <div id="hud">
    <div>纬度 <span id="lat">0.000000</span>°</div>
    <div>经度 <span id="lon">0.000000</span>°</div>
    <div>高度 <span id="alt">0</span> m</div>
    <div>时间 <span id="time">00:00:00 UTC</span></div>
    <div>天气 <span id="weatherLabel">晴</span></div>
  </div>
  <div id="teleport">
    <input id="inpLat" type="number" placeholder="纬度" value="0" step="any">
    <input id="inpLon" type="number" placeholder="经度" value="0" step="any">
    <button id="btnTeleport">传送</button>
  </div>
  <div id="controls">
    <label>天气
      <select id="weatherSelect">
        <option value="0">晴天</option>
        <option value="1">阴天</option>
        <option value="2">下雨</option>
      </select>
    </label>
    <label>☀️ 时间 <input type="range" id="timeOffset" min="-12" max="12" step="0.1" value="0"></label>
    <label>☁️ 云量 <input type="range" id="cloudAmount" min="0" max="1" step="0.01" value="0.5"></label>
    <label>💨 风速 <input type="range" id="windSpeed" min="0" max="30" step="1" value="8"></label>
  </div>

  <!-- 摇杆 -->
  <div id="stick-left"><div class="thumb" id="thumb-left"></div></div>
  <div id="stick-right"><div class="thumb" id="thumb-right"></div></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ================== Supabase（可选） ==================
    // 替换为你的 Supabase 项目信息，并在 SQL 中执行：
    // create table player_positions (id uuid primary key references auth.users, latitude float, longitude float, altitude float, rotation float, updated_at timestamptz);
    // alter publication supabase_realtime add table player_positions;
    // create function get_server_time() returns timestamptz as $$ begin return now(); end; $$ language plpgsql;
    let supabase = null;
    try {
      const SUPABASE_URL = 'https://your-project.supabase.co';
      const SUPABASE_ANON_KEY = 'your-anon-key';
      const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
      supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) { console.warn('离线模式，无联机'); }

    // ================== 场景 ==================
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x87CEEB, 0.000008);
    const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 2, 250000);
    camera.position.set(0, 120, 200);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference:'high-performance' });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // TAA
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const taaPass = new ShaderPass({
      uniforms: { tDiffuse: { value:null }, tHistory: { value:null }, uMix: { value:0.1 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `uniform sampler2D tDiffuse, tHistory; uniform float uMix; varying vec2 vUv; void main(){ vec4 curr=texture2D(tDiffuse,vUv); vec4 hist=texture2D(tHistory,vUv); gl_FragColor=mix(curr,hist,uMix); }`
    });
    taaPass.renderToScreen = true;
    composer.addPass(taaPass);
    let historyRT = new THREE.WebGLRenderTarget(innerWidth, innerHeight);
    let historyRT2 = new THREE.WebGLRenderTarget(innerWidth, innerHeight);
    function swapHistory(){ [historyRT, historyRT2] = [historyRT2, historyRT]; taaPass.uniforms.tHistory.value = historyRT.texture; }

    window.addEventListener('resize', ()=>{
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
      historyRT.setSize(innerWidth, innerHeight);
      historyRT2.setSize(innerWidth, innerHeight);
    });

    // ================== 坐标与地形高度 ==================
    const METERS_PER_DEG = 111320;
    function latLonToWorld(lat,lon){ return { x: lon*METERS_PER_DEG*Math.cos(0), z: lat*METERS_PER_DEG }; }
    function worldToLatLon(x,z){ return { lat: z/METERS_PER_DEG, lon: x/(METERS_PER_DEG*Math.cos(0)) }; }

    // CPU 端噪声（与 GPU 一致，用于计算地形高度和草地动画）
    function hash(p){ p=[p[0]*0.3183099+0.1,p[1]*0.3183099+0.1,p[2]*0.3183099+0.1]; p=[p[0]*17,p[1]*17,p[2]*17]; return (p[0]*Math.floor(p[1])*Math.floor(p[2])*(p[0]+p[1]+p[2]))%1; }
    function noise(x,y,z){ const s=[110,241,171], i=[Math.floor(x),Math.floor(y),Math.floor(z)], f=[x-i[0],y-i[1],z-i[2]], u=f.map(v=>v*v*(3-2*v)); const n=i[0]+i[1]*s[0]+i[2]*s[1]; return mix(mix(mix(hash([i[0],i[1],i[2]]),hash([i[0]+1,i[1],i[2]]),u[0]),mix(hash([i[0],i[1]+1,i[2]]),hash([i[0]+1,i[1]+1,i[2]]),u[0]),u[1]),mix(mix(hash([i[0],i[1],i[2]+1]),hash([i[0]+1,i[1],i[2]+1]),u[0]),mix(hash([i[0],i[1]+1,i[2]+1]),hash([i[0]+1,i[1]+1,i[2]+1]),u[0]),u[1]),u[2]); }
    function fbm(x,y,z,oct=5,lac=2.0,gain=0.5){ let v=0,amp=0.5,freq=1; for(let i=0;i<oct;i++){ v+=amp*noise(x*freq,y*freq,z*freq); freq*=lac; amp*=gain; } return v; }
    function getTerrainHeight(wx,wz){ const h=fbm(wx*0.000005,0,wz*0.000005,5,2.0,0.5); const d=fbm(wx*0.0003,0,wz*0.0003,3,2.5,0.5)*0.3; return (h+d)*500-100; } // 缓丘

    // ================== 共享 Uniforms ==================
    const uniforms = {
      sunDir: { value: new THREE.Vector3(0,1,0) },
      sunElevation: { value: 0.5 },
      time: { value: 0 },
      cloudAmount: { value: 0.5 },
      windSpeed: { value: 8 },
      cameraPos: { value: new THREE.Vector3() },
      weatherType: { value: 0 }
    };

    // ================== 太阳 ==================
    function getSun(date){
      const h=date.getUTCHours()+date.getUTCMinutes()/60+date.getUTCSeconds()/3600;
      const day=Math.floor((date-new Date(date.getFullYear(),0,0))/86400000);
      const dec=23.45*Math.sin((2*Math.PI/365)*(day-81));
      const ha=(h-12)*15*Math.PI/180;
      const sinAlt=Math.sin(0)*Math.sin(dec*Math.PI/180)+Math.cos(0)*Math.cos(dec*Math.PI/180)*Math.cos(ha);
      const ele=Math.asin(sinAlt);
      const azi=Math.atan2(-Math.sin(ha),Math.tan(dec*Math.PI/180)*Math.cos(0)-Math.sin(0)*Math.cos(ha));
      return { dir: new THREE.Vector3(Math.cos(ele)*Math.sin(azi),sinAlt,Math.cos(ele)*Math.cos(azi)).normalize(), ele };
    }

    // ================== 天空球 ==================
    const skyGeom = new THREE.SphereGeometry(95000,64,64);
    const skyMat = new THREE.ShaderMaterial({
      uniforms: { sunDir: uniforms.sunDir, sunElevation: uniforms.sunElevation, time: uniforms.time, weatherType: uniforms.weatherType },
      vertexShader: `varying vec3 vP; void main(){ vec4 wp=modelMatrix*vec4(position,1.0); vP=wp.xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        precision highp float; varying vec3 vP;
        uniform vec3 sunDir; uniform float sunElevation, time, weatherType;
        vec3 skyCol(vec3 rd, vec3 sunDir, float sunAngle, float weather){
          float y=rd.y;
          vec3 day=mix(vec3(0.35,0.55,0.95),vec3(0.8,0.9,1.0),y*0.5+0.5);
          vec3 sunset=mix(vec3(0.95,0.5,0.3),vec3(0.5,0.2,0.5),y*0.5+0.5);
          vec3 night=mix(vec3(0.02,0.02,0.1),vec3(0.01,0.01,0.05),y*0.5+0.5);
          vec3 overcast=mix(vec3(0.5,0.55,0.6),vec3(0.3,0.35,0.4),y*0.5+0.5);
          float d=smoothstep(0.1,0.4,sunAngle), t=smoothstep(-0.1,0.1,sunAngle)*(1.0-d), n=1.0-smoothstep(-0.1,0.1,sunAngle);
          vec3 sky=day*d+sunset*t+night*n;
          float w=smoothstep(0.5,1.0,weather);
          sky=mix(sky,overcast,w);
          float mu=dot(rd,sunDir);
          float glow=exp(-(1.0-mu)*12.0)*0.6*clamp(sunAngle*4.0,0.0,1.0);
          sky+=vec3(1.0,0.9,0.7)*glow*(1.0-n)*(1.0-w*0.8);
          float hor=exp(-abs(y)*15.0)*0.4;
          sky+=vec3(1.0,0.5,0.2)*hor*(1.0-n)*(1.0-w*0.7);
          return sky;
        }
        float stars(vec3 rd){ float s=0.0; vec3 p=rd*5000.0; for(int i=0;i<3;i++){ vec3 q=fract(p*(1.0+float(i)*0.7))-0.5; s+=smoothstep(0.005,0.0,length(q))*0.015; p*=2.3; } return s; }
        void main(){
          vec3 rd=normalize(vP);
          vec3 col=skyCol(rd,sunDir,sunElevation,weatherType);
          float night=1.0-smoothstep(-0.05,0.05,sunElevation);
          float starVis=1.0-smoothstep(0.5,1.0,weatherType);
          col+=stars(rd)*1.2*night*starVis;
          gl_FragColor=vec4(col,1.0);
        }`,
      side: THREE.BackSide, depthWrite: false
    });
    scene.add(new THREE.Mesh(skyGeom, skyMat));

    // ================== 体积云 ==================
    const cloudGeom = new THREE.SphereGeometry(62000,64,64);
    const cloudMat = new THREE.ShaderMaterial({
      uniforms: uniforms,
      vertexShader: `varying vec3 vP; void main(){ vec4 wp=modelMatrix*vec4(position,1.0); vP=wp.xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        precision highp float; varying vec3 vP;
        uniform vec3 sunDir, cameraPos; uniform float time, cloudAmount, windSpeed, sunElevation, weatherType;
        float hash(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
        float noise(vec3 x){ const vec3 s=vec3(110,241,171); vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f); float n=i.x+i.y*s.x+i.z*s.y;
          return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                     mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }
        float fbm(vec3 p,int oct,float lac,float gain){ float v=0.0,amp=0.5,freq=1.0; for(int i=0;i<6;i++){ if(i>=oct)break; v+=amp*noise(p*freq); freq*=lac; amp*=gain; } return v; }
        vec3 domainWarp(vec3 p,float t,float str){ float q1=fbm(p+vec3(0,t*0.1,0),3,2.0,0.5); float q2=fbm(p+vec3(q1,0,t*0.05)*str,3,2.0,0.5); return p+vec3(q1,q2,q1+q2)*str; }
        float density(vec3 pos){
          vec3 warped=domainWarp(pos*0.00008+vec3(0,windSpeed*time*0.008,0),time,1.6);
          float d=fbm(warped,5,2.3,0.55);
          float cov=fbm(pos*0.000004+vec3(0,0,time*0.015),2,2.0,0.6);
          float base=d-(1.0-cloudAmount*0.85);
          base=clamp(base,0.0,1.0)*smoothstep(0.3,0.7,cov);
          if(weatherType>0.5) base+=0.2*smoothstep(0.5,1.0,weatherType);
          return clamp(base,0.0,1.0);
        }
        float phase(float mu,float g){ return (1.0-g*g)/pow(1.0+g*g-2.0*g*mu,1.5); }
        void main(){
          vec3 ro=cameraPos, rd=normalize(vP-ro);
          float t=100.0; vec4 col=vec4(0.0);
          for(int i=0;i<160;i++){
            vec3 pos=ro+rd*t;
            float den=density(pos);
            if(den>0.005){
              float mu=dot(rd,sunDir), ph=phase(mu,0.2)*0.65+phase(mu,-0.15)*0.35;
              float light=max(0.1,mu*0.6+0.4)*0.9;
              vec3 c=mix(vec3(0.95,0.55,0.3),vec3(1.0),smoothstep(-0.1,0.3,sunElevation));
              c=mix(c,vec3(0.25,0.4,0.75),1.0-smoothstep(-0.1,0.1,sunElevation));
              c=mix(c,vec3(0.5,0.5,0.55),smoothstep(0.5,1.0,weatherType));
              float alpha=den*0.04;
              col.rgb+=alpha*light*ph*c;
              col.a+=alpha;
              if(col.a>0.95)break;
            }
            t+=180.0+t*0.006;
            if(t>80000.0)break;
          }
          if(col.a<0.02)discard;
          gl_FragColor=vec4(col.rgb,col.a);
        }`,
      side: THREE.FrontSide, transparent: true, depthWrite: false, blending: THREE.NormalBlending
    });
    scene.add(new THREE.Mesh(cloudGeom, cloudMat));

    // ================== 草原地面 ==================
    const groundGeom = new THREE.PlaneGeometry(300000,300000,400,400);
    const groundMat = new THREE.ShaderMaterial({
      uniforms: {
        sunDir: uniforms.sunDir, time: uniforms.time, cloudAmount: uniforms.cloudAmount,
        windSpeed: uniforms.windSpeed, sunElevation: uniforms.sunElevation,
        cameraPos: uniforms.cameraPos, weatherType: uniforms.weatherType
      },
      vertexShader: `varying vec3 vP; varying vec2 vUv; void main(){ vec4 wp=modelMatrix*vec4(position,1.0); vP=wp.xyz; vUv=wp.xz/300000.0+0.5; gl_Position=projectionMatrix*viewMatrix*wp; }`,
      fragmentShader: `
        precision highp float; varying vec3 vP; varying vec2 vUv;
        uniform vec3 sunDir, cameraPos; uniform float time, cloudAmount, windSpeed, sunElevation, weatherType;

        // 噪声（与云一致）
        float hash(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
        float noise(vec3 x){ const vec3 s=vec3(110,241,171); vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f); float n=i.x+i.y*s.x+i.z*s.y;
          return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                     mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }
        float fbm(vec3 p,int oct,float lac,float gain){ float v=0.0,amp=0.5,freq=1.0; for(int i=0;i<6;i++){ if(i>=oct)break; v+=amp*noise(p*freq); freq*=lac; amp*=gain; } return v; }
        vec3 domainWarp(vec3 p,float t,float str){ float q1=fbm(p+vec3(0,t*0.1,0),3,2.0,0.5); float q2=fbm(p+vec3(q1,0,t*0.05)*str,3,2.0,0.5); return p+vec3(q1,q2,q1+q2)*str; }
        float cloudShadow(vec3 pos){
          vec3 warped=domainWarp(pos*0.00008+vec3(0,windSpeed*time*0.008,0),time,1.6);
          float d=fbm(warped,5,2.3,0.55);
          float cov=fbm(pos*0.000004+vec3(0,0,time*0.015),2,2.0,0.6);
          float base=d-(1.0-cloudAmount*0.85);
          base=clamp(base,0.0,1.0)*smoothstep(0.3,0.7,cov);
          if(weatherType>0.5) base+=0.2*smoothstep(0.5,1.0,weatherType);
          return clamp(base,0.0,1.0);
        }

        // 草原纹理
        vec3 grassColor(vec3 pos){
          // 基础绿色系
          float n1 = fbm(pos*0.02, 3, 2.5, 0.5);
          float n2 = fbm(pos*0.05+vec3(0,0,time*0.02), 3, 2.0, 0.5);
          // 草的颜色变化：深绿到浅绿，混合枯黄
          vec3 green1 = vec3(0.25, 0.5, 0.1);  // 深草
          vec3 green2 = vec3(0.4, 0.65, 0.2);  // 鲜草
          vec3 dry = vec3(0.6, 0.55, 0.2);     // 干草
          vec3 dirt = vec3(0.5, 0.4, 0.3);     // 泥土小径
          vec3 flower = vec3(0.9, 0.8, 0.4);   // 野花黄

          float t = smoothstep(0.3, 0.7, n1);
          vec3 col = mix(green1, green2, t);
          col = mix(col, dry, smoothstep(0.5, 0.8, n2)*0.3);
          // 泥土路（基于大尺度噪声）
          float path = fbm(pos*0.001, 3, 2.0, 0.5);
          float pathMask = smoothstep(0.45, 0.55, path);
          col = mix(col, dirt, pathMask*0.6);
          // 野花点缀
          float flowerMask = step(0.7, fbm(pos*0.5+vec3(0,0,time*0.03), 3, 3.0, 0.5));
          col = mix(col, flower, flowerMask*0.15);
          // 风吹草动（细微颜色偏移）
          col += (noise(pos*0.03+vec3(time*0.1,0,0))-0.5)*0.03;
          return col;
        }

        void main(){
          vec3 terrain = grassColor(vP);
          // 云影
          float shadow = 1.0 - cloudShadow(vP+sunDir*200.0)*0.6;
          // 光照
          float NdotL = max(0.2, dot(vec3(0,1,0), sunDir)*0.8+0.2);
          vec3 color = terrain * (0.25 + shadow * NdotL);
          // 雨天湿润效果
          if(weatherType>1.5) color *= 0.75;
          // 距离雾
          float dist = length(vP-cameraPos);
          float fog = 1.0 - exp(-dist*0.000008);
          vec3 fogCol = mix(vec3(0.7,0.8,0.9), vec3(0.4,0.45,0.5), weatherType);
          color = mix(color, fogCol, fog);
          gl_FragColor = vec4(color,1.0);
        }`,
      side: THREE.DoubleSide
    });
    const ground = new THREE.Mesh(groundGeom, groundMat);
    ground.rotation.x = -Math.PI/2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ================== 雨滴 ==================
    const rainCount = 5000;
    const rainGeom = new THREE.BufferGeometry();
    const rainPos = new Float32Array(rainCount*3);
    for(let i=0;i<rainCount*3;i+=3){ rainPos[i]=(Math.random()-0.5)*500; rainPos[i+1]=Math.random()*300; rainPos[i+2]=(Math.random()-0.5)*500; }
    rainGeom.setAttribute('position', new THREE.BufferAttribute(rainPos,3));
    const rainMat = new THREE.PointsMaterial({ color:0xaaaadd, size:0.5, transparent:true, depthWrite:false });
    const rain = new THREE.Points(rainGeom, rainMat);
    rain.visible = false;
    scene.add(rain);

    // ================== 角色 ==================
    let player = { lat:0, lon:0, alt:2, yaw:0 };
    let model, mixer;
    const loader = new GLTFLoader();
    loader.load('https://models.readyplayer.me/64b59b0e8d2d2e5c4f90f3f1.glb', (gltf)=>{
      model = gltf.scene;
      model.castShadow = true;
      scene.add(model);
      mixer = new THREE.AnimationMixer(model);
      gltf.animations.forEach(c=>mixer.clipAction(c).play());
    }, undefined, ()=>{
      const geo = new THREE.CapsuleGeometry(0.5,1.8);
      const mat = new THREE.MeshStandardMaterial({ color:0x4488ff });
      model = new THREE.Mesh(geo, mat);
      model.castShadow = true;
      model.receiveShadow = true;
      scene.add(model);
    });

    function updatePlayer(){
      const {x,z} = latLonToWorld(player.lat, player.lon);
      const terrainY = getTerrainHeight(x,z);
      player.alt = terrainY + 2;
      if(model) model.position.set(x, player.alt, z);
      // 相机跟随
      const camDist = 30;
      const camHeight = 15;
      const angle = player.yaw;
      camera.position.set(x - Math.sin(angle)*camDist, player.alt+camHeight, z - Math.cos(angle)*camDist);
      camera.lookAt(x, player.alt+1, z);
      document.getElementById('lat').textContent = player.lat.toFixed(6);
      document.getElementById('lon').textContent = player.lon.toFixed(6);
      document.getElementById('alt').textContent = Math.round(player.alt);
      if(supabase) syncPlayer();
    }
    async function syncPlayer(){
      const {data:{user}} = await supabase.auth.getUser();
      if(!user) return;
      supabase.from('player_positions').upsert({
        id:user.id, latitude:player.lat, longitude:player.lon,
        altitude:player.alt, rotation:player.yaw, updated_at:new Date()
      });
    }

    // ================== 摇杆 ==================
    function stick(containerId, thumbId, cb){
      const c=document.getElementById(containerId), t=document.getElementById(thumbId);
      let active=false, sx=0, sy=0;
      c.addEventListener('touchstart', e=>{ e.preventDefault(); active=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY; });
      c.addEventListener('touchmove', e=>{ if(!active)return; e.preventDefault(); const dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy; const d=Math.min(Math.sqrt(dx*dx+dy*dy),40); const a=Math.atan2(dy,dx); t.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`; cb({x:dx/40, y:dy/40}); });
      c.addEventListener('touchend', ()=>{ active=false; t.style.transform='translate(0,0)'; cb({x:0,y:0}); });
    }
    let move={x:0,y:0}, look={x:0,y:0};
    stick('stick-left','thumb-left', d=>{ move=d; });
    stick('stick-right','thumb-right', d=>{ look=d; });

    // 键盘
    window.addEventListener('keydown', e=>{
      if(e.key==='w') move.y=1; if(e.key==='s') move.y=-1;
      if(e.key==='a') move.x=-1; if(e.key==='d') move.x=1;
    });
    window.addEventListener('keyup', e=>{
      if(e.key==='w'||e.key==='s') move.y=0;
      if(e.key==='a'||e.key==='d') move.x=0;
    });

    // ================== UI ==================
    document.getElementById('btnTeleport').onclick=()=>{
      const lat=parseFloat(document.getElementById('inpLat').value);
      const lon=parseFloat(document.getElementById('inpLon').value);
      if(!isNaN(lat)&&!isNaN(lon)){ player.lat=lat; player.lon=lon; updatePlayer(); }
    };
    document.getElementById('weatherSelect').onchange=e=>{
      uniforms.weatherType.value=parseFloat(e.target.value);
      document.getElementById('weatherLabel').textContent=['晴','阴天','下雨'][e.target.value];
    };
    document.getElementById('cloudAmount').oninput=e=>uniforms.cloudAmount.value=+e.target.value;
    document.getElementById('windSpeed').oninput=e=>uniforms.windSpeed.value=+e.target.value;
    let timeOffset=0;
    document.getElementById('timeOffset').oninput=e=>timeOffset=parseFloat(e.target.value);
    setInterval(()=>document.getElementById('time').textContent=new Date().toISOString().slice(11,19)+' UTC',1000);

    // 联机
    if(supabase){
      supabase.rpc('get_server_time').single().then(({data})=>{ if(data) timeOffset=(new Date(data).getTime()-Date.now())/3600000; });
      supabase.auth.signInAnonymously();
      const remotes=new Map();
      supabase.channel('public:player_positions').on('postgres_changes',{event:'*',schema:'public',table:'player_positions'},payload=>{
        const p=payload.new;
        if(!p||p.id===supabase.auth.user()?.id)return;
        if(!remotes.has(p.id)){
          const g=new THREE.CapsuleGeometry(0.5,1.8), m=new THREE.MeshStandardMaterial({color:Math.random()*0xffffff});
          const a=new THREE.Mesh(g,m); a.castShadow=a.receiveShadow=true; scene.add(a); remotes.set(p.id,a);
        }
        const a=remotes.get(p.id), {x,z}=latLonToWorld(p.latitude,p.longitude);
        a.position.set(x,p.altitude||2,z);
      }).subscribe();
    }

    // ================== 动画循环 ==================
    function animate(){
      requestAnimationFrame(animate);
      // 移动
      if(move.x!==0||move.y!==0){
        const speed=0.00003;
        player.lat += move.y * speed * 10;
        player.lon += move.x * speed * 10;
        updatePlayer();
      }
      // 视角（使用 look 摇杆调整 yaw）
      if(look.x!==0||look.y!==0){
        player.yaw += look.x * 0.03;
      }
      // 太阳
      const now=new Date(Date.now()+timeOffset*3600000);
      const sun=getSun(now);
      uniforms.sunDir.value.copy(sun.dir);
      uniforms.sunElevation.value=sun.ele;
      uniforms.time.value+=0.016;
      uniforms.cameraPos.value.copy(camera.position);
      // 雨
      if(uniforms.weatherType.value>1.5){
        rain.visible=true;
        const pos=rain.geometry.attributes.position.array;
        for(let i=0;i<pos.length;i+=3){ pos[i+1]-=0.8; if(pos[i+1]<0)pos[i+1]=300; }
        rain.geometry.attributes.position.needsUpdate=true;
        rain.position.copy(camera.position);
      }else rain.visible=false;
      if(mixer) mixer.update(0.016);
      // 渲染
      renderer.setRenderTarget(historyRT);
      renderer.render(scene, camera);
      renderer.setRenderTarget(null);
      taaPass.uniforms.tDiffuse.value=historyRT.texture;
      composer.render();
      swapHistory();
    }
    animate();
  </script>
</body>
</html>
