<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>后室·深渊 | 联机持枪最终版</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', monospace; background: #000; touch-action: none; }
        .svg-icon { width: 20px; height: 20px; display: inline-block; vertical-align: middle; filter: drop-shadow(0 0 2px #000); }
        #ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; color: #ffe6b3; text-shadow: 0 0 4px #000; font-weight: bold; display: none; }
        .stats-panel { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.65); backdrop-filter: blur(8px); padding: 10px 18px; border-radius: 12px; border-left: 3px solid #ffcc77; display: flex; gap: 20px; flex-wrap: wrap; font-size: 14px; }
        .stat-item { display: flex; align-items: center; gap: 6px; }
        .weapon-panel { position: absolute; bottom: 30px; left: 20px; background: rgba(0,0,0,0.75); backdrop-filter: blur(12px); border-radius: 40px; padding: 8px 20px; display: flex; gap: 20px; border: 1px solid #ffaa66; }
        .weapon-slot { padding: 6px 16px; border-radius: 30px; background: #2a2a2a; display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; pointer-events: auto; transition: all 0.1s; }
        .weapon-slot.active { background: #ffaa33; color: #000; box-shadow: 0 0 10px #ffaa66; }
        .ammo-panel { position: absolute; bottom: 30px; right: 30px; background: rgba(0,0,0,0.75); backdrop-filter: blur(12px); padding: 10px 24px; border-radius: 40px; font-size: 24px; font-weight: bold; border: 1px solid #ffaa66; display: flex; align-items: center; gap: 10px; }
        .distance-panel { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.55); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 20px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .crosshair { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: white; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 2px rgba(0,0,0,0.5), 0 0 0 4px rgba(255,200,100,0.5); pointer-events: none; z-index: 20; transition: transform 0.05s ease-out; }
        .joystick-area { position: absolute; bottom: 30px; left: 30px; width: 140px; height: 140px; pointer-events: auto; z-index: 30; }
        .joystick-base { width: 100%; height: 100%; border-radius: 50%; background: rgba(30,30,30,0.6); border: 2px solid rgba(255,200,100,0.7); position: relative; backdrop-filter: blur(4px); }
        .joystick-thumb { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,200,100,0.8); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 0 10px rgba(255,200,100,0.5); }
        .action-btn, .melee-btn, .interact-mobile-btn { position: absolute; pointer-events: auto; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(8px); z-index: 30; border-radius: 50%; transition: all 0.1s; }
        .action-btn { bottom: 40px; right: 40px; width: 75px; height: 75px; background: rgba(180,50,50,0.85); border: 2px solid #ffaa66; box-shadow: 0 0 15px rgba(255,80,40,0.6); }
        .melee-btn { bottom: 140px; right: 40px; width: 60px; height: 60px; background: rgba(80,80,80,0.85); border: 2px solid #ccaa77; }
        .interact-mobile-btn { bottom: 230px; right: 40px; width: 60px; height: 60px; background: rgba(50,150,200,0.85); border: 2px solid #88ccff; display: flex; font-size: 20px; font-weight: bold; }
        .interact-hint { position: absolute; bottom: 180px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); padding: 10px 24px; border-radius: 40px; color: #ffdd99; font-size: 14px; border: 1px solid #ffcc77; pointer-events: none; white-space: nowrap; font-weight: bold; }
        #chat-box { position: absolute; bottom: 20px; left: 20px; width: 280px; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); border-radius: 12px; pointer-events: auto; z-index: 40; font-size: 12px; }
        #chat-messages { height: 150px; overflow-y: auto; padding: 8px; color: #ccc; }
        #chat-input { width: 100%; background: #222; border: 1px solid #ffaa66; color: #ffebc2; padding: 6px; border-radius: 8px; pointer-events: auto; }
        #password-panel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); backdrop-filter: blur(12px); padding: 20px; border-radius: 20px; border: 1px solid #ffcc77; text-align: center; z-index: 100; display: none; flex-direction: column; gap: 10px; width: 300px; }
        #password-panel input { padding: 8px; background: #222; border: 1px solid #ffaa66; color: #fff; border-radius: 8px; font-size: 18px; text-align: center; }
        #password-panel button { background: #ffaa33; border: none; padding: 8px; border-radius: 8px; cursor: pointer; }
        #tape-viewer { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); backdrop-filter: blur(12px); padding: 20px; border-radius: 20px; border: 1px solid #ffcc77; text-align: center; z-index: 100; display: none; flex-direction: column; gap: 10px; width: 320px; }
        #task-panel { position: absolute; top: 80px; right: 20px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); padding: 8px 12px; border-radius: 12px; font-size: 12px; pointer-events: none; display: flex; align-items: center; gap: 6px; }
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ffcc77; font-size: 24px; letter-spacing: 4px; backdrop-filter: blur(4px); z-index: 200; }
        .damage-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(180,0,0,0); pointer-events: none; z-index: 15; transition: background 0.08s; }
        #orientation-tip { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: #ffcc77; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; font-size: 20px; text-align: center; backdrop-filter: blur(10px); display: none; pointer-events: auto; cursor: pointer; }
        @media (max-width: 700px) {
            .stats-panel { font-size: 10px; top: 10px; left: 10px; gap: 8px; padding: 6px 12px; }
            .weapon-panel { font-size: 12px; bottom: 20px; left: 10px; gap: 8px; padding: 6px 12px; }
            .ammo-panel { font-size: 16px; padding: 6px 12px; bottom: 20px; right: 20px; }
            .joystick-area { width: 110px; height: 110px; bottom: 20px; left: 20px; }
            .action-btn, .melee-btn, .interact-mobile-btn { width: 55px; height: 55px; }
            .melee-btn { bottom: 95px; right: 32px; }
            .interact-mobile-btn { bottom: 165px; right: 32px; }
            #chat-box { width: 240px; bottom: 10px; left: 10px; }
        }
    </style>
</head>
<body>
<div id="orientation-tip" style="display: none;">
    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#ffcc77" stroke-width="1.5"><path d="M4 4h16v16H4zM8 2v4M16 2v4M2 8h4M18 8h4M2 16h4M18 16h4M8 22v-4M16 22v-4"/><path d="M12 8v8M8 12h8"/></svg>

</div>
<div id="loading">

    <div id="loading-status">加载超写实引擎...</div>
</div>
<div id="ui" style="display: none;">
    <div class="stats-panel">
        <div class="stat-item"><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="#ff6666"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span id="health-val">100</span>%</div>
        <div class="stat-item"><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="#88ccff"><path d="M12 3v1M12 20v1M3 12H2M22 12h-1M5.64 5.64l.7.7M17.66 17.66l.7.7M5.64 18.36l.7-.7M17.66 6.34l.7-.7"/><circle cx="12" cy="12" r="4"/><path d="M12 8v4l2 2"/></svg><span id="sanity-val">100</span></div>
        <div class="stat-item"><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="#66ff66"><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M6 6l2 2M16 16l2 2M6 18l2-2M16 8l2-2"/><path d="M12 6v6l3 2"/></svg><span id="stamina-val">100</span></div>
        <div class="stat-item"><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="#88ff88"><path d="M2 12h20M12 2v20"/><circle cx="12" cy="12" r="3"/></svg><span id="water-val">0</span></div>
    </div>
    <div class="weapon-panel">
        <div class="weapon-slot" id="weap-pistol"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="9" width="18" height="10" rx="1"/><line x1="6" y1="14" x2="18" y2="14"/></svg>M1911</div>
        <div class="weapon-slot" id="weap-smg"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="10" width="20" height="8" rx="1"/><path d="M7 10V8a2 2 0 012-2h6a2 2 0 012 2v3"/></svg>勇士</div>
        <div class="weapon-slot" id="weap-mg3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="10" width="18" height="8" rx="1"/><path d="M8 10V7a2 2 0 012-2h4a2 2 0 012 2v3"/><circle cx="12" cy="14" r="1"/></svg>MG3</div>
    </div>
    <div class="ammo-panel"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffcc77"><path d="M12 2v4M12 18v4M4 12H2M6 12H4M20 12h-2M22 12h-2M18 6l2-2M16 8l2-2M6 18l-2 2M8 16l-2 2"/><circle cx="12" cy="12" r="3"/></svg><span id="ammo-val">50</span>/<span id="ammo-max">200</span></div>
    <div class="distance-panel"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffcc77"><circle cx="12" cy="12" r="10"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><span id="distance-val">0</span>m <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#88ff88"><path d="M3 12h3l2-3 2 3 2-3 2 3 2-3 2 3 2-3 1 3"/><path d="M3 18h18"/></svg><span id="exit-dist">15km</span></div>
    <div class="crosshair"></div>
    <div class="interact-hint" id="interact-hint" style="display: none;">按 E 或点击右侧🔘</div>
    <div id="task-panel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffaa66"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="8" y1="12" x2="16" y2="12"/></svg> 线索: 0/5</div>
</div>
<div id="chat-box">
    <div id="chat-messages">[系统] 按回车聊天<br></div>
    <input type="text" id="chat-input" placeholder="聊天..." autocomplete="off">
</div>
<div id="tape-viewer">
    <h3>📼 录像带内容</h3>
    <div id="tape-text">...</div>
    <button id="close-tape">关闭</button>
</div>
<div id="password-panel">
    <h3>🔐 出口密码</h3>
    <p>输入从涂鸦、录像带、尸体纸条中推理的4位数字</p>
    <input type="text" id="password-input" maxlength="4" placeholder="0000">
    <button id="submit-password">验证</button>
    <button id="cancel-password">取消</button>
</div>
<div class="joystick-area" id="joystick-area"><div class="joystick-base"><div class="joystick-thumb" id="joystick-thumb"></div></div></div>
<div class="action-btn" id="shoot-btn">🔫</div>
<div class="melee-btn" id="melee-btn">🗡️</div>
<div class="interact-mobile-btn" id="interact-mobile-btn">🔘</div>
<div class="damage-flash" id="damage-flash"></div>

<!-- 多重 CDN 保证 Three.js 加载成功 -->
<script src="https://cdn.bootcdn.net/ajax/libs/three.js/r128/three.min.js"></script>
<script>if(typeof THREE==='undefined') document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
    (function() {
        // ==================== 横屏提示（不阻塞） ====================
        const orientationTip = document.getElementById('orientation-tip');
        function checkOrientation() {
            if (window.innerHeight > window.innerWidth) orientationTip.style.display = 'flex';
            else orientationTip.style.display = 'none';
        }
        window.addEventListener('resize', checkOrientation);
        orientationTip.addEventListener('click', () => orientationTip.style.display = 'none');
        checkOrientation();
        
        // ==================== 强制显示 Three.js 错误提示 ====================
        if (typeof THREE === 'undefined') {
            alert("Three.js 库加载失败，请检查网络后刷新页面。");
            throw new Error("THREE not loaded");
        }
        
        // ==================== WebGL 检测 ====================
        let canvasTest = document.createElement('canvas');
        let gl = canvasTest.getContext('webgl') || canvasTest.getContext('experimental-webgl');
        if (!gl) {
            alert('您的浏览器不支持 WebGL，无法运行游戏。请更换浏览器。');
            throw new Error('WebGL not supported');
        }
        
        // ==================== Supabase 配置（您提供的） ====================
        const SUPABASE_URL = "https://mvgljtcfxmvtgbshpsgd.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_t6M6Fbds5o4q3sCC0aIZZQ_LXT0BGBF";
        let supabase = null;
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log("Supabase 初始化成功");
        } catch(e) { console.warn("Supabase 初始化失败，游戏将运行在单机模式", e); }
        
        // ==================== 游戏配置 ====================
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        const PIXEL_RATIO = isMobile ? 1.0 : 1.5;
        const SHADOW_SIZE = isMobile ? 512 : 1024;
        
        // 核心变量
        let scene, camera, renderer, clock = new THREE.Clock(), raycaster = new THREE.Raycaster();
        let keyState = { w: false, s: false, a: false, d: false, e: false };
        let cameraRotation = { yaw: 0, pitch: 0 };
        let health = 100, sanity = 100, stamina = 100, almondWater = 0;
        let currentDistance = 0, lastPosition = { x: 0, z: 0 };
        let currentWeapon = 1;
        let ammo = { pistol: 16, smg: 50, mg3: 0 };
        let maxAmmo = { pistol: 200, smg: 200, mg3: 200 };
        let weaponDamage = { pistol: 1, smg: 1, mg3: 1 };
        let fireRate = { pistol: 0.35, smg: 0.12, mg3: 0.08 };
        let lastShootTime = 0;
        let weaponModel = null;
        let flashlightLight, ambientLight, dirLight, postFX;
        let gameStarted = false, startRoomGroup = null, doorMeshes = [];
        let joystickActive = false, joystickVec = { x: 0, z: 0 }, isPointerLock = false;
        let supplyRooms = [], exitDoor = null;
        let soundEvents = [];
        let darkZones = [];
        
        // 谜题系统
        let cluesCollected = 0;
        let hasTape = false;
        let tapeObject = null;
        let tapeDigit = "";
        let graffitiDigits = [];
        let corpseDigits = [];
        let corpses = [];
        
        // 实体数组
        let smilers = [], mimics = [], dolls = [], partygoers = [], shadows = [];
        
        // 联机变量
        let currentUser = null;
        let players = new Map();
        
        // UI 元素
        const statusDiv = document.getElementById('loading-status');
        function setStatus(msg) { if(statusDiv) statusDiv.innerText = msg; console.log(msg); }
        
        const healthSpan = document.getElementById('health-val');
        const sanitySpan = document.getElementById('sanity-val');
        const staminaSpan = document.getElementById('stamina-val');
        const waterSpan = document.getElementById('water-val');
        const distanceSpan = document.getElementById('distance-val');
        const exitDistSpan = document.getElementById('exit-dist');
        const ammoValSpan = document.getElementById('ammo-val');
        const ammoMaxSpan = document.getElementById('ammo-max');
        const interactHint = document.getElementById('interact-hint');
        const taskSpan = document.getElementById('task-panel');
        const tapeViewer = document.getElementById('tape-viewer');
        const tapeTextDiv = document.getElementById('tape-text');
        const passwordPanel = document.getElementById('password-panel');
        const passwordInput = document.getElementById('password-input');
        const closeTapeBtn = document.getElementById('close-tape');
        const submitPasswordBtn = document.getElementById('submit-password');
        const cancelPasswordBtn = document.getElementById('cancel-password');
        const interactMobileBtn = document.getElementById('interact-mobile-btn');
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        
        function addChatMessage(sender, msg) {
            let div = document.createElement('div');
            div.innerHTML = `<span style="color:#88ff88">[${sender}]</span> ${msg}`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        chatInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter' && chatInput.value.trim()) {
                addChatMessage('你', chatInput.value);
                chatInput.value = '';
            }
        });
        
        function updateUI() {
            healthSpan.innerText = Math.floor(health);
            sanitySpan.innerText = Math.floor(sanity);
            staminaSpan.innerText = Math.floor(stamina);
            waterSpan.innerText = almondWater;
            distanceSpan.innerText = Math.floor(currentDistance);
            let remain = 15000 - (currentDistance % 15000);
            exitDistSpan.innerText = remain > 1000 ? (remain/1000).toFixed(1)+'km' : remain+'m';
            let cur = currentWeapon===0 ? ammo.pistol : (currentWeapon===1 ? ammo.smg : ammo.mg3);
            let max = currentWeapon===0 ? maxAmmo.pistol : (currentWeapon===1 ? maxAmmo.smg : maxAmmo.mg3);
            ammoValSpan.innerText = cur;
            ammoMaxSpan.innerText = max;
            document.getElementById('weap-pistol').classList.toggle('active', currentWeapon===0);
            document.getElementById('weap-smg').classList.toggle('active', currentWeapon===1);
            document.getElementById('weap-mg3').classList.toggle('active', currentWeapon===2);
            taskSpan.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffaa66"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="8" y1="12" x2="16" y2="12"/></svg> 线索: ${cluesCollected}/5`;
        }
        
        function takeDamage(amt) {
            if(!gameStarted) return;
            health = Math.max(0, health - amt);
            sanity = Math.max(0, sanity - amt*0.4);
            updateUI();
            let flash = document.getElementById('damage-flash');
            flash.style.backgroundColor = 'rgba(180,0,0,0.7)';
            setTimeout(()=>flash.style.backgroundColor='rgba(180,0,0,0)', 120);
            if(health<=0) { alert("你已死亡，刷新页面重来"); window.location.reload(); }
        }
        
        // ========== 辅助函数 ==========
        function addHitEffect(pos) {
            for(let i=0;i<12;i++){
                let particle = new THREE.Mesh(new THREE.SphereGeometry(0.04,6,6), new THREE.MeshStandardMaterial({color:0xaa2222, emissive:0x441111}));
                particle.position.copy(pos);
                scene.add(particle);
                let vel = new THREE.Vector3((Math.random()-0.5)*2.5, Math.random()*2.5, (Math.random()-0.5)*2.5);
                let life = 0.6;
                let start = performance.now();
                function animateParticle(){
                    let now = performance.now();
                    let dt = Math.min(0.033, (now-start)/1000);
                    if(dt>=life){ scene.remove(particle); return; }
                    particle.position.x += vel.x*dt;
                    particle.position.y += vel.y*dt;
                    particle.position.z += vel.z*dt;
                    vel.y -= 6*dt;
                    requestAnimationFrame(animateParticle);
                }
                requestAnimationFrame(animateParticle);
            }
        }
        
        function addSoundEvent(pos, radius) {
            soundEvents.push({ pos: pos.clone(), radius: radius, time: performance.now() / 1000 });
        }
        
        let entityLastHitTime = new Map();
        function applySuppression(entity, currentTime) {
            if(!entityLastHitTime.has(entity.id)) entityLastHitTime.set(entity.id, []);
            let hits = entityLastHitTime.get(entity.id);
            hits.push(currentTime);
            while(hits.length && currentTime - hits[0] > 1.0) hits.shift();
            let recent = hits.filter(t => currentTime - t < 0.5);
            if(recent.length >= 3){
                entity.suppressed = true;
                entity.suppressTimer = 2.0;
                entity.originalSpeed = entity.speed;
                entity.speed = 7.5;
            }
        }
        
        function shoot() {
            if(!gameStarted) return;
            let cur = currentWeapon===0 ? ammo.pistol : (currentWeapon===1 ? ammo.smg : ammo.mg3);
            if(cur<=0) return;
            let now = Date.now()/1000;
            let rate = fireRate[currentWeapon===0?'pistol':(currentWeapon===1?'smg':'mg3')];
            if(now - lastShootTime < rate) return;
            lastShootTime = now;
            if(currentWeapon===0) ammo.pistol--;
            else if(currentWeapon===1) ammo.smg--;
            else ammo.mg3--;
            updateUI();
            cameraRotation.pitch += 0.045;
            if(weaponModel) {
                weaponModel.position.y = -0.12;
                weaponModel.rotation.x = 0.18;
                setTimeout(()=>{ if(weaponModel){ weaponModel.position.y=0; weaponModel.rotation.x=0; } },100);
            }
            let muzzleFlash = new THREE.PointLight(0xffaa66,1.8,6);
            muzzleFlash.position.set(0.45,-0.1,0.65);
            if(weaponModel) weaponModel.add(muzzleFlash);
            setTimeout(()=>{ if(weaponModel) weaponModel.remove(muzzleFlash); },80);
            addSoundEvent(camera.position, 40);
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            let dmg = weaponDamage[currentWeapon===0?'pistol':(currentWeapon===1?'smg':'mg3')];
            let allMonsters = [...smilers, ...mimics, ...dolls, ...partygoers, ...shadows];
            for(let m of allMonsters){
                let hits = raycaster.intersectObject(m.mesh, true);
                if(hits.length > 0){
                    m.health -= dmg;
                    if(m.type === 'smiler') m.detection += 3;
                    addHitEffect(hits[0].point);
                    applySuppression(m, now);
                    if(m.health <= 0){
                        scene.remove(m.mesh);

        function createPBRTexture(type){
            let canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            let ctx = canvas.getContext('2d');
            if(type === 'wall'){
                ctx.fillStyle = '#ebc87e';
                ctx.fillRect(0,0,canvas.width,canvas.height);
                for(let i=0;i<8000;i++){
                    ctx.fillStyle = `rgba(100,80,50,${Math.random()*0.3})`;
                    ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 4,4);
                }
                ctx.strokeStyle = '#b89a6a';
                ctx.lineWidth = 4;
                for(let i=0;i<100;i++){
                    ctx.beginPath();
                    ctx.moveTo(Math.random()*canvas.width, Math.random()*canvas.height);
                    ctx.lineTo(Math.random()*canvas.width, Math.random()*canvas.height);
                    ctx.stroke();
                }
            } else if(type === 'floor'){
                ctx.fillStyle = '#c8a86a';
                ctx.fillRect(0,0,canvas.width,canvas.height);
                for(let i=0;i<6000;i++){
                    ctx.fillStyle = `rgba(70,50,30,${Math.random()*0.35})`;
                    ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 6,6);
                }
                ctx.strokeStyle = '#8a623a';
                ctx.lineWidth = 3;
                let step = 256;
                for(let x=0;x<canvas.width;x+=step){
                    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
                }
                for(let y=0;y<canvas.height;y+=step){
                    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
                }
            } else {
                ctx.fillStyle = '#f5e6b0';
                ctx.fillRect(0,0,canvas.width,canvas.height);
                for(let i=0;i<4000;i++){
                    ctx.fillStyle = `rgba(160,140,100,${Math.random()*0.25})`;
                    ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 4,4);
                }
            }
            let tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2,2);
            return tex;
        }
        
        const CHUNK_SIZE = 120;
        function generateChunk(cx,cz){
            const group=new THREE.Group();
            const startX=cx*CHUNK_SIZE, startZ=cz*CHUNK_SIZE;
            const cell=12, grid=10;
            const wallMat=new THREE.MeshStandardMaterial({map:createPBRTexture('wall'), roughness:0.65, metalness:0.05});
            const floorMat=new THREE.MeshStandardMaterial({map:createPBRTexture('floor'), roughness:0.8, metalness:0.02});
            const ceilMat=new THREE.MeshStandardMaterial({map:createPBRTexture('ceil'), roughness:0.7, metalness:0.01});
            for(let i=0;i<grid;i++){
                for(let j=0;j<grid;j++){
                    const x=startX+i*cell, z=startZ+j*cell;
                    const isWall=(Math.sin(i*0.8)+Math.cos(j*1.1))>0.5 && (i!==0 && i!==grid-1 && j!==0 && j!==grid-1);
                    if(i===0||i===grid-1||j===0||j===grid-1||isWall){
                        const wall=new THREE.Mesh(new THREE.BoxGeometry(cell,4.2,0.4),wallMat);
                        wall.position.set(x+cell/2,2.1,z+cell/2);
                        group.add(wall);
                    }
                    const floor=new THREE.Mesh(new THREE.PlaneGeometry(cell,cell),floorMat);
                    floor.rotation.x=-Math.PI/2; floor.position.set(x+cell/2,0,z+cell/2);
                    group.add(floor);
                    const ceil=new THREE.Mesh(new THREE.PlaneGeometry(cell,cell),ceilMat);
                    ceil.rotation.x=Math.PI/2; ceil.position.set(x+cell/2,4.2,z+cell/2);
                    group.add(ceil);
                    let inDark = darkZones.some(dz => Math.hypot((x+cell/2)-dz.center.x, (z+cell/2)-dz.center.z) < dz.radius);
                    if(!inDark && (i+j)%2===0 && Math.random()<0.6){
                        const light=new THREE.PointLight(0xffdd99,0.8,22);
                        light.position.set(x+cell/2,3.2,z+cell/2);
                        group.add(light);
                    } else if(inDark && (i+j)%2===0 && Math.random()<0.2){
                        const light=new THREE.PointLight(0xffaa66,0.3,18);
                        light.position.set(x+cell/2,3.2,z+cell/2);
                        group.add(light);
                    }
                }
            }
            return group;
        }
        
        let loadedChunks=new Map();

            const pcx=Math.floor(camera.position.x/CHUNK_SIZE);
            const pcz=Math.floor(camera.position.z/CHUNK_SIZE);
            for(let dx=-2;dx<=2;dx++){
                for(let dz=-2;dz<=2;dz++){
                    const cx=pcx+dx, cz=pcz+dz;
                    const key=cx+','+cz;
                    if(!loadedChunks.has(key)){
                        const chunk=generateChunk(cx,cz);
                        scene.add(chunk);
                        loadedChunks.set(key,chunk);
                    }
                }
            }
            for(let [k,grp] of loadedChunks){
                let [cx,cz]=k.split(',').map(Number);
                if(Math.abs(cx-pcx)>3 || Math.abs(cz-pcz)>3){
                    scene.remove(grp);
                    loadedChunks.delete(k);
                }
            }
        }

        function handleInteractions(){
            if(!gameStarted) return;
            for(let i=0;i<supplyRooms.length;i++){

                if(s.used) continue;
                if(camera.position.distanceTo(s.pos)<2.5){
                    interactHint.style.display='block';
                    if(keyState.e || window.triggerInteract){
                        s.used=true;
                        scene.remove(s.mesh);

                        ammo.smg=Math.min(maxAmmo.smg,ammo.smg+30);
                        ammo.mg3=Math.min(maxAmmo.mg3,ammo.mg3+100);
                        almondWater++;

                        updateUI();
                        supplyRooms.splice(i,1);
                        interactHint.style.display='none';
                        window.triggerInteract = false;
                    }
                    return;
                }
            }
            for(let i=0;i<corpses.length;i++){
                let c = corpses[i];
                if(c.collected) continue;
                if(camera.position.distanceTo(c.pos) < 2){
                    interactHint.style.display='block';
                    if(keyState.e || window.triggerInteract){
                        c.collected = true;
                        corpseDigits.push(c.digit);
                        cluesCollected++;
                        updateUI();
                        addChatMessage('系统', `尸体纸条上写着一个数字: ${c.digit}`);
                        interactHint.style.display='none';
                        window.triggerInteract = false;
                    }
                    return;
                }
            }
            if(tapeObject && !hasTape && camera.position.distanceTo(tapeObject.position) < 2){
                interactHint.style.display='block';
                if(keyState.e || window.triggerInteract){
                    scene.remove(tapeObject);

                    tapeDigit = Math.floor(Math.random()*10).toString();

        function hasLineOfSight(fromPos, toPos, ignoreObj = null) {
            let dir = new THREE.Vector3().subVectors(toPos, fromPos).normalize();
            let dist = fromPos.distanceTo(toPos);
            raycaster.set(fromPos, dir);
            let intersects = raycaster.intersectObjects(scene.children, true);
            for (let i of intersects) {
                if (i.distance < dist && i.object !== ignoreObj && i.object !== camera) {
                    if (i.object.geometry && i.object.geometry.boundingSphere && i.object.geometry.boundingSphere.radius > 0.2) {
                        return false;
                    }
                }
            }
            return true;
        }
        
        function getClosestSound(pos, maxRadius) {
            let best=null, bestDist=Infinity;
            for(let ev of soundEvents){
                let d=pos.distanceTo(ev.pos);
                if(d<ev.radius && d<bestDist){ bestDist=d; best=ev; }
            }
            return best;
        }

            constructor(pos){
                this.type='smiler';
                this.mesh=this.createModel();
                this.mesh.position.copy(pos);
                scene.add(this.mesh);
                this.health=200; this.speed=8.33; this.damage=22;
                this.state='idle'; this.animTime=Math.random()*Math.PI*2;
                this.attackCd=0; this.teleportCd=0; this.hasLocated=false;
                this.peekCooldown=0; this.isPeeking=false; this.detection=0;
                this.id=Math.random();
                this.suppressed=false; this.suppressTimer=0;
            }
            createModel(){
                const g=new THREE.Group();
                const bodyMat = new THREE.MeshStandardMaterial({color:0xeeeeee, emissive:0x442222, roughness:0.2});
                const body=new THREE.Mesh(new THREE.SphereGeometry(0.6,64,64),bodyMat);
                body.position.y=0.6; g.add(body);
                const headMat = new THREE.MeshStandardMaterial({color:0xffdddd, emissive:0x552222, roughness:0.15});
                const head=new THREE.Mesh(new THREE.SphereGeometry(0.65,80,80),headMat);
                head.position.y=1.2; g.add(head);
                const mouth=new THREE.Mesh(new THREE.TorusGeometry(0.55,0.08,64,128,Math.PI),new THREE.MeshStandardMaterial({color:0x000000, emissive:0x330000}));
                mouth.rotation.x=0.2; mouth.position.set(0,1.15,0.6); g.add(mouth);
                for(let i=-6;i<=6;i++){
                    const tooth=new THREE.Mesh(new THREE.ConeGeometry(0.08,0.16,12),new THREE.MeshStandardMaterial({color:0xffffaa, emissive:0xffaa66}));
                    tooth.position.set(i*0.12,1.1+Math.abs(i)*0.02,0.66); g.add(tooth);
                }
                const eyeMat = new THREE.MeshStandardMaterial({color:0xff3300, emissive:0xff2200});
                const el=new THREE.Mesh(new THREE.SphereGeometry(0.22,48,48),eyeMat);
                el.position.set(-0.26,1.38,0.65); g.add(el);
                const er=el.clone(); er.position.set(0.26,1.38,0.65); g.add(er);
                return g;
            }
            update(delta, playerPos){
                if(this.suppressed){
                    this.suppressTimer -= delta;
                    if(this.suppressTimer<=0){ this.suppressed=false; this.speed=8.33; }
                }
                let inDark = darkZones.some(dz => this.mesh.position.distanceTo(dz.center) < dz.radius);
                let spd = this.speed;
                if(inDark && !this.suppressed) spd *= 1.1;
                this.animTime+=delta*4; this.attackCd-=delta; this.teleportCd-=delta; this.peekCooldown-=delta;
                let dist=this.mesh.position.distanceTo(playerPos);
                let canSee=false;
                let toPlayer=new THREE.Vector3().subVectors(playerPos,this.mesh.position);
                let forward=new THREE.Vector3(0,0,1).applyQuaternion(this.mesh.quaternion);
                if(dist<25 && toPlayer.angleTo(forward)<Math.PI/1.8 && hasLineOfSight(this.mesh.position, playerPos, this.mesh)) canSee=true;
                let sound=getClosestSound(this.mesh.position,35);
                if(canSee) this.detection+=delta*2;
                else this.detection=Math.max(0,this.detection-delta*0.5);
                if(this.detection>=15 && !this.hasLocated && this.peekCooldown<=0 && dist>10){
                    this.hasLocated=true; this.isPeeking=true; this.peekCooldown=3.0;
                    let corner=playerPos.clone().sub(this.mesh.position).normalize().multiplyScalar(6);
                    this.mesh.position.lerp(corner,0.8);
                    setTimeout(()=>{
                        if(this.mesh){
                            let angle=Math.random()*Math.PI*2;
                            let rad=5+Math.random()*4;
                            let newPos=playerPos.clone().add(new THREE.Vector3(Math.cos(angle)*rad,0,Math.sin(angle)*rad));
                            this.mesh.position.copy(newPos);
                            this.state='chase'; this.isPeeking=false;
                        }
                    },800);
                }
                if(this.hasLocated || canSee || sound || dist<20) this.state='chase';
                else this.state='idle';
                if(this.state==='chase' && !this.isPeeking){
                    let dir=new THREE.Vector3().subVectors(playerPos,this.mesh.position).normalize();
                    this.mesh.position.x+=dir.x*spd*delta;
                    this.mesh.position.z+=dir.z*spd*delta;
                    this.mesh.lookAt(playerPos);
                    if(dist<1.8 && this.attackCd<=0){ takeDamage(this.damage); this.attackCd=1.2; }
                }
                this.mesh.position.y=0.65+Math.sin(this.animTime*5)*0.08;
            }
        }

        function spawnEntityNearby(){
            let total = smilers.length + mimics.length + dolls.length + partygoers.length + shadows.length;
            if(total < 6 && Math.random()<0.015){
                let angle=Math.random()*Math.PI*2;
                let dist=22+Math.random()*20;
                let pos=new THREE.Vector3(camera.position.x+Math.cos(angle)*dist,0,camera.position.z+Math.sin(angle)*dist);
                let inDark = darkZones.some(dz => pos.distanceTo(dz.center) < dz.radius);
                let r = Math.random();
                if(inDark){
                    if(r<0.5) smilers.push(new Smiler(pos));
                    else if(r<0.7) mimics.push(new Mimic(pos));
                    else if(r<0.85) dolls.push(new Doll(pos));
                    else shadows.push(new Shadow(pos));
                } else {
                    if(r<0.2) smilers.push(new Smiler(pos));
                    else if(r<0.4) mimics.push(new Mimic(pos));
                    else if(r<0.6) dolls.push(new Doll(pos));
                    else if(r<0.8) partygoers.push(new Partygoer(pos));
                    else shadows.push(new Shadow(pos));
                }
            }
        }
        
        function updateMovement(delta){
            if(!gameStarted) return;
            let moveX=0, moveZ=0;
            if(keyState.w) moveZ-=1; if(keyState.s) moveZ+=1; if(keyState.a) moveX-=1; if(keyState.d) moveX+=1;
            if(joystickActive){ moveX=joystickVec.x; moveZ=joystickVec.z; }
            if(moveX!==0 || moveZ!==0){
                let speed=8.61;
                if(stamina<20) speed*=0.6;
                const forward=new THREE.Vector3(-Math.sin(cameraRotation.yaw),0,-Math.cos(cameraRotation.yaw));
                const right=new THREE.Vector3(Math.cos(cameraRotation.yaw),0,-Math.sin(cameraRotation.yaw));
                let vel=new THREE.Vector3(0,0,0);
                vel.addScaledVector(forward,moveZ);
                vel.addScaledVector(right,moveX);
                vel.normalize();
                camera.position.x+=vel.x*speed*delta;
                camera.position.z+=vel.z*speed*delta;
                let dx=camera.position.x-lastPosition.x;
                let dz=camera.position.z-lastPosition.z;
                currentDistance+=Math.sqrt(dx*dx+dz*dz);
                lastPosition.x=camera.position.x;
                lastPosition.z=camera.position.z;
                updateUI();
                checkSpawning();
            }
            camera.rotation.order='YXZ';
            camera.rotation.y=cameraRotation.yaw;
            camera.rotation.x=cameraRotation.pitch;
            cameraRotation.pitch=Math.max(-0.75,Math.min(0.65,cameraRotation.pitch));
            if((keyState.w||keyState.s||keyState.a||keyState.d||joystickActive) && stamina>0){
                camera.rotation.x += Math.sin(performance.now()*0.02)*0.005;
            }
        }
        
        function updateStats(delta){
            let moving=(keyState.w||keyState.s||keyState.a||keyState.d||joystickActive);
            if(moving && stamina>0) stamina=Math.max(0,stamina-delta*14);
            else if(!moving && stamina<100) stamina=Math.min(100,stamina+delta*9);
            let closest=999;
            let all=[...smilers,...mimics,...dolls,...partygoers,...shadows];
            for(let e of all) closest=Math.min(closest,camera.position.distanceTo(e.mesh.position));
            if(closest<18) sanity=Math.max(0,sanity-delta*7*(1-closest/18));
            else if(sanity<100) sanity=Math.min(100,sanity+delta*2.5);
            updateUI();
        }
        
        function setupPost(){
            let w=innerWidth,h=innerHeight;
            let rt=new THREE.WebGLRenderTarget(w,h);
            let pScene=new THREE.Scene();
            let pCamera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
            let pMat=new THREE.ShaderMaterial({
                uniforms:{tDiffuse:{value:rt.texture},uTime:{value:0},uContrast:{value:1.2},uSaturation:{value:1.1}},
                vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
                fragmentShader:`
                    uniform sampler2D tDiffuse;
                    uniform float uTime;
                    uniform float uContrast;
                    uniform float uSaturation;
                    varying vec2 vUv;
                    float rand(vec2 co){return fract(sin(dot(co,vec2(12.9898,78.233)))*43758.5453);}
                    void main(){
                        vec2 uv=vUv;
                        vec4 color=texture2D(tDiffuse,uv);
                        float grain=rand(uv+floor(uTime*30.0))*0.05;
                        color.rgb+=grain;
                        float scanline=sin(uv.y*900.0)*0.01;
                        color.rgb-=scanline;
                        color.rgb = (color.rgb - 0.5) * uContrast + 0.5;
                        float gray = dot(color.rgb, vec3(0.299, 0.587, 0.114));
                        color.rgb = mix(vec3(gray), color.rgb, uSaturation);
                        float vig=1.0-length(uv-0.5)*0.35;
                        color.rgb*=vig;
                        gl_FragColor=vec4(color.rgb,1.0);
                    }
                `
            });
            let quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),pMat);
            pScene.add(quad);
            return {renderTarget:rt, scene:pScene, camera:pCamera, material:pMat};
        }
        
        // 联机同步（轻量级，不阻塞）
        async function syncPlayers(){
            if(!supabase || !currentUser || !gameStarted) return;
            try {
                await supabase.from('players').upsert({
                    user_id: currentUser.id,
                    name: currentUser.email?.split('@')[0] || 'Player',
                    pos_x: camera.position.x,
                    pos_z: camera.position.z,
                    rot_y: cameraRotation.yaw,
                    weapon: currentWeapon,
                    health: health,
                    is_dead: health<=0,
                    death_x: health<=0 ? camera.position.x : 0,
                    death_z: health<=0 ? camera.position.z : 0,
                    last_seen: new Date()
                });
                let { data } = await supabase.from('players').select('*').neq('user_id', currentUser.id);
                if(data) {
                    for(let p of data) {
                        if(!players.has(p.user_id)) {
                            players.set(p.user_id, { name: p.name, is_dead: p.is_dead, death_x: p.death_x, death_z: p.death_z });
                        } else {
                            let player = players.get(p.user_id);
                            player.is_dead = p.is_dead;
                            player.death_x = p.death_x;
                            player.death_z = p.death_z;
                        }
                    }
                }
                for(let [id, p] of players) {
                    if(p.is_dead && camera.position.distanceTo(new THREE.Vector3(p.death_x,0,p.death_z))<3 && almondWater>0 && health>0) {
                        await supabase.from('players').update({ is_dead: false }).eq('user_id', id);
                        almondWater--;
                        updateUI();
                        addChatMessage('系统', `你救活了 ${p.name}`);
                    }
                }
            } catch(e) { console.warn("联机同步失败", e); }
        }

            dirLight.shadow.mapSize.height=SHADOW_SIZE;
            scene.add(dirLight);
            let fillLight=new THREE.PointLight(0x886644,0.5);
            fillLight.position.set(0,2,0);
            scene.add(fillLight);
            flashlightLight=new THREE.SpotLight(0xffeedd,1.5,35,Math.PI/5,0.6);
            flashlightLight.position.set(0,1.6,0);
            flashlightLight.target=camera;
            flashlightLight.castShadow=true;
            scene.add(flashlightLight);
            postFX=setupPost();
            startRoomGroup=createStartRoom();
            scene.add(startRoomGroup);
            
            // 事件绑定
            document.addEventListener('keydown',(e)=>{
                let k=e.key.toLowerCase();
                if(k==='w') keyState.w=true;
                if(k==='s') keyState.s=true;
                if(k==='a') keyState.a=true;
                if(k==='d') keyState.d=true;
                if(k==='e') keyState.e=true;
                if(k==='1') switchWeapon(0);
                if(k==='2') switchWeapon(1);
                if(k==='3') switchWeapon(2);
                if(k===' '||k==='f') shoot();
                if(k==='v') meleeAttack();
            });
            document.addEventListener('keyup',(e)=>{
                let k=e.key.toLowerCase();
                if(k==='w') keyState.w=false;
                if(k==='s') keyState.s=false;
                if(k==='a') keyState.a=false;
                if(k==='d') keyState.d=false;
                if(k==='e') keyState.e=false;
            });
            renderer.domElement.addEventListener('click',()=>renderer.domElement.requestPointerLock());
            document.addEventListener('pointerlockchange',()=>isPointerLock=document.pointerLockElement===renderer.domElement);
            document.addEventListener('mousemove',(e)=>{
                if(isPointerLock){
                    cameraRotation.yaw-=e.movementX*0.002;
                    cameraRotation.pitch-=e.movementY*0.002;
                    cameraRotation.pitch=Math.max(-0.7,Math.min(0.6,cameraRotation.pitch));
                }
            });
            document.getElementById('shoot-btn').addEventListener('click',shoot);
            document.getElementById('melee-btn').addEventListener('click',meleeAttack);
            interactMobileBtn.addEventListener('click',()=>{
                window.triggerInteract = true;
            });
            closeTapeBtn.addEventListener('click',()=>{ tapeViewer.style.display = 'none'; });
            submitPasswordBtn.addEventListener('click',()=>{
                let input = passwordInput.value;
                let correct = graffitiDigits.join('') + tapeDigit;
                if(input === correct){
                    alert("密码正确！出口门打开了！");
                    passwordPanel.style.display = 'none';
                    alert("成功逃离后室！刷新页面重新游戏。");
                    window.location.reload();
                } else {
                    alert("密码错误！");
                }
            });
            cancelPasswordBtn.addEventListener('click',()=>{ passwordPanel.style.display = 'none'; });
            
            // 摇杆
            const joyArea=document.getElementById('joystick-area');
            const thumb=document.getElementById('joystick-thumb');
            let joyCenter={x:0,y:0};
            joyArea.addEventListener('touchstart',(e)=>{
                e.preventDefault();
                const rect=joyArea.getBoundingClientRect();
                joyCenter={x:rect.left+rect.width/2, y:rect.top+rect.height/2};
                joystickActive=true;
            });
            joyArea.addEventListener('touchmove',(e)=>{
                e.preventDefault();
                const touch=e.touches[0];
                const dx=touch.clientX-joyCenter.x;
                const dy=touch.clientY-joyCenter.y;
                const len=Math.min(45,Math.hypot(dx,dy));
                const angle=Math.atan2(dy,dx);
                const tx=Math.cos(angle)*len, ty=Math.sin(angle)*len;
                thumb.style.transform=`translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px))`;
                joystickVec.x=tx/45;
                joystickVec.z=ty/45;
            });
            joyArea.addEventListener('touchend',()=>{
                joystickActive=false;
                joystickVec={x:0,z:0};
                thumb.style.transform='translate(-50%, -50%)';
            });
            
            // 初始化用户（匿名）
            if(supabase) {
                try {
                    const { data, error } = await supabase.auth.signInAnonymously();
                    if(!error && data.user) currentUser = data.user;
                    else currentUser = { id: 'anon_' + Math.random(), email: 'player' };
                } catch(e) { currentUser = { id: 'anon_' + Math.random(), email: 'player' }; }
            } else {
                currentUser = { id: 'anon_' + Math.random(), email: 'player' };
            }
            
            let lastSync=0, lastTime=0;
            function animate(){
                requestAnimationFrame(animate);
                let now=performance.now();
                let delta=Math.min(0.033,(now-lastTime)/1000);
                if(delta<=0){ lastTime=now; return; }
                lastTime=now;
                if(!gameStarted){
                    for(let d of doorMeshes){
                        let dp=d.mesh.getWorldPosition(new THREE.Vector3());
                        if(camera.position.distanceTo(dp)<2.5 && keyState.e){
                            gameStarted=true;
                            scene.remove(startRoomGroup);
                            updateChunks();
                            switchWeapon(1);
                            for(let i=0;i<3;i++) spawnEntityNearby();
                            document.getElementById('ui').style.display='block';
                            document.getElementById('loading').style.display='none';
                            interactHint.style.display='none';
                            for(let d of graffitiDigits) cluesCollected++;
                            updateUI();
                            addChatMessage('系统', `你注意到墙上的涂鸦数字: ${graffitiDigits.join(', ')}`);
                            break;
                        }
                    }
                    interactHint.innerText='靠近任意门 按 E 或点击🔘进入后室';
                    interactHint.style.display='block';
                } else {
                    updateMovement(delta);
                    updateChunks();
                    updateFootstepSound(delta);
                    for(let s of smilers) s.update(delta, camera.position);
                    for(let m of mimics) m.update(delta, camera.position);
                    for(let d of dolls) d.update(delta, camera.position);
                    for(let p of partygoers) p.update(delta, camera.position);
                    for(let sh of shadows) sh.update(delta, camera.position);
                    spawnEntityNearby();
                    handleInteractions();
                    updateStats(delta);
                    let curTime=now/1000;
                    soundEvents = soundEvents.filter(ev => curTime - ev.time < 2.0);
                    if(now - lastSync > 200 && supabase) {
                        syncPlayers();
                        lastSync = now;
                    }
                }
                renderer.setRenderTarget(postFX.renderTarget);
                renderer.render(scene,camera);
                renderer.setRenderTarget(null);
                postFX.material.uniforms.uTime.value=now/1000;
                renderer.render(postFX.scene,postFX.camera);
            }
            animate();
        }
        
        // 启动游戏
        initGame().catch(err => {
            console.error("游戏启动失败:", err);
            alert("游戏启动失败，请刷新页面重试。错误：" + err.message);
        });
    })();
</script>
</body>
</html>
