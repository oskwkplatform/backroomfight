<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>后室·深渊 | 终极完整版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { overflow: hidden; font-family: 'Courier New', monospace; background: #000; touch-action: none; }
        .svg-icon { width: 20px; height: 20px; display: inline-block; vertical-align: middle; filter: drop-shadow(0 0 2px #000); }
        
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ffcc77; font-size: 24px; letter-spacing: 4px; transition: opacity 0.8s; }
        #loading.hidden { opacity: 0; pointer-events: none; }
        #loading-status { margin-top: 20px; font-size: 16px; color: #aa8866; }
        #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 50; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        #start-overlay.active { display: flex; }
        #start-hint-box { background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); padding: 20px 40px; border-radius: 16px; border: 2px solid #ffcc77; color: #ffdd99; font-size: 18px; text-align: center; line-height: 1.8; animation: pulse 1.5s ease infinite; pointer-events: auto; cursor: pointer; }
        @keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.02); opacity: 1; } }
        
        #ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; color: #ffe6b3; text-shadow: 0 0 4px #000; font-weight: bold; display: none; }
        #ui.active { display: block; }
        .stats-panel { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.65); backdrop-filter: blur(8px); padding: 10px 18px; border-radius: 12px; border-left: 3px solid #ffcc77; display: flex; gap: 20px; flex-wrap: wrap; font-size: 14px; }
        .stat-item { display: flex; align-items: center; gap: 6px; }
        .weapon-panel { position: absolute; bottom: 30px; left: 20px; background: rgba(0,0,0,0.75); backdrop-filter: blur(12px); border-radius: 40px; padding: 8px 20px; display: flex; gap: 20px; border: 1px solid #ffaa66; }
        .weapon-slot { padding: 6px 16px; border-radius: 30px; background: #2a2a2a; display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; pointer-events: auto; transition: all 0.1s; }
        .weapon-slot.active { background: #ffaa33; color: #000; box-shadow: 0 0 10px #ffaa66; }
        .ammo-panel { position: absolute; bottom: 30px; right: 30px; background: rgba(0,0,0,0.75); backdrop-filter: blur(12px); padding: 10px 24px; border-radius: 40px; font-size: 24px; font-weight: bold; border: 1px solid #ffaa66; display: flex; align-items: center; gap: 10px; }
        .distance-panel { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.55); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 20px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .crosshair { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: white; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 2px rgba(0,0,0,0.5), 0 0 0 4px rgba(255,200,100,0.5); pointer-events: none; z-index: 20; }
        .interact-hint { position: absolute; bottom: 180px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); padding: 10px 24px; border-radius: 40px; color: #ffdd99; font-size: 14px; border: 1px solid #ffcc77; pointer-events: none; white-space: nowrap; font-weight: bold; z-index: 25; }
        #task-panel { position: absolute; top: 80px; right: 20px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); padding: 8px 12px; border-radius: 12px; font-size: 12px; pointer-events: none; display: flex; align-items: center; gap: 6px; }
        #chat-box { position: absolute; bottom: 20px; left: 20px; width: 280px; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); border-radius: 12px; pointer-events: auto; z-index: 40; font-size: 12px; }
        #chat-messages { height: 150px; overflow-y: auto; padding: 8px; color: #ccc; }
        #chat-input { width: 100%; background: #222; border: 1px solid #ffaa66; color: #ffebc2; padding: 6px; border-radius: 8px; pointer-events: auto; }
        #password-panel, #tape-viewer { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); backdrop-filter: blur(12px); padding: 20px; border-radius: 20px; border: 1px solid #ffcc77; text-align: center; z-index: 100; display: none; flex-direction: column; gap: 10px; }
        #password-panel { width: 300px; }
        #tape-viewer { width: 320px; color: #ffe6b3; }
        #password-panel input { padding: 8px; background: #222; border: 1px solid #ffaa66; color: #fff; border-radius: 8px; font-size: 18px; text-align: center; }
        #password-panel button, #tape-viewer button { background: #ffaa33; border: none; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        .joystick-area { position: absolute; bottom: 30px; left: 30px; width: 140px; height: 140px; pointer-events: auto; z-index: 30; }
        .joystick-base { width: 100%; height: 100%; border-radius: 50%; background: rgba(30,30,30,0.6); border: 2px solid rgba(255,200,100,0.7); position: relative; backdrop-filter: blur(4px); }
        .joystick-thumb { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,200,100,0.8); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 0 10px rgba(255,200,100,0.5); }
        .action-btn, .melee-btn, .interact-mobile-btn { position: absolute; pointer-events: auto; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(8px); z-index: 30; border-radius: 50%; transition: all 0.1s; color: #fff; }
        .action-btn { bottom: 40px; right: 40px; width: 75px; height: 75px; background: rgba(180,50,50,0.85); border: 2px solid #ffaa66; box-shadow: 0 0 15px rgba(255,80,40,0.6); }
        .melee-btn { bottom: 140px; right: 40px; width: 60px; height: 60px; background: rgba(80,80,80,0.85); border: 2px solid #ccaa77; }
        .interact-mobile-btn { bottom: 230px; right: 40px; width: 60px; height: 60px; background: rgba(50,150,200,0.85); border: 2px solid #88ccff; font-size: 20px; font-weight: bold; }
        .damage-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(180,0,0,0); pointer-events: none; z-index: 15; transition: background 0.08s; }
        #orientation-tip { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: #ffcc77; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; font-size: 20px; text-align: center; backdrop-filter: blur(10px); pointer-events: auto; cursor: pointer; }
        
        @media (max-width: 700px) {
            .stats-panel { font-size: 10px; top: 10px; left: 10px; gap: 8px; padding: 6px 12px; }
            .weapon-panel { font-size: 12px; bottom: 20px; left: 10px; gap: 8px; padding: 6px 12px; }
            .ammo-panel { font-size: 16px; padding: 6px 12px; bottom: 20px; right: 20px; }
            .joystick-area { width: 110px; height: 110px; bottom: 20px; left: 20px; }
            .action-btn, .melee-btn, .interact-mobile-btn { width: 55px; height: 55px; }
            .melee-btn { bottom: 95px; right: 32px; }
            .interact-mobile-btn { bottom: 165px; right: 32px; }
            #chat-box { width: 240px; bottom: 10px; left: 10px; }
        }
    </style>
</head>
<body>

<div id="orientation-tip" onclick="this.style.display='none'">
    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#ffcc77" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 2v4M16 2v4M2 8h4M18 8h4M2 16h4M18 16h4M8 22v-4M16 22v-4"/><path d="M12 8v8M8 12h8"/></svg>
    <p>请将手机旋转至横屏模式</p>
    <p style="font-size:14px; margin-top:20px;">点击屏幕继续</p>
</div>

<div id="loading">
    <div style="font-size:28px; margin-bottom:12px;">后室·深渊</div>
    <div style="font-size:14px; color:#aa8866;">终极完整版</div>
    <div id="loading-status">加载中...</div>
</div>

<div id="start-overlay">
    <div id="start-hint-box">
        <div style="font-size:22px;">✧ 进入后室 ✧</div>
        <div>WASD 移动 / 鼠标转向</div>
        <div>走近 <span style="color:#ffaa33;">黄色门</span> 按 <span style="color:#ffaa33;">E</span> 进入</div>
        <div style="margin-top:10px; font-size:12px;">点击任意处开始体验</div>
    </div>
</div>

<div id="ui">
    <div class="stats-panel">
        <div class="stat-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff6666"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span id="health-val">100</span>%</div>
        <div class="stat-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#88ccff"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg><span id="sanity-val">100</span></div>
        <div class="stat-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#66ff66"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg><span id="stamina-val">100</span></div>
        <div class="stat-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#88ff88"><path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="3"/></svg><span id="water-val">0</span></div>
    </div>
    <div class="weapon-panel">
        <div class="weapon-slot" id="weap-pistol"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="9" width="18" height="10" rx="1"/><line x1="6" y1="14" x2="18" y2="14"/></svg>M1911</div>
        <div class="weapon-slot active" id="weap-smg"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="10" width="20" height="8" rx="1"/><path d="M7 10V8a2 2 0 012-2h6a2 2 0 012 2v3"/></svg>勇士</div>
        <div class="weapon-slot" id="weap-mg3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="10" width="18" height="8" rx="1"/><path d="M8 10V7a2 2 0 012-2h4a2 2 0 012 2v3"/><circle cx="12" cy="14" r="1"/></svg>MG3</div>
    </div>
    <div class="ammo-panel"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffcc77"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/><circle cx="12" cy="12" r="3"/></svg><span id="ammo-val">50</span>/<span id="ammo-max">200</span></div>
    <div class="distance-panel"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffcc77"><circle cx="12" cy="12" r="10"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><span id="distance-val">0</span>m <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#88ff88"><path d="M3 12h3l2-3 2 3 2-3 2 3 2-3 2 3 2-3 1 3"/><path d="M3 18h18"/></svg><span id="exit-dist">15km</span></div>
    <div class="crosshair"></div>
    <div class="interact-hint" id="interact-hint" style="display:none">按 E 或点击 [E]</div>
    <div id="task-panel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffaa66"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="8" y1="12" x2="16" y2="12"/></svg> 线索: <span id="clue-count">0</span>/5</div>
</div>

<div id="chat-box"><div id="chat-messages">[系统] 按回车聊天<br></div><input type="text" id="chat-input" placeholder="聊天..."></div>
<div id="tape-viewer"><h3>录像带</h3><div id="tape-text"></div><button onclick="document.getElementById('tape-viewer').style.display='none'">关闭</button></div>
<div id="password-panel"><h3>出口密码</h3><p>输入4位数字</p><input type="text" id="password-input" maxlength="4"><button id="submit-password">验证</button><button onclick="document.getElementById('password-panel').style.display='none'">取消</button></div>

<div class="joystick-area" id="joystick-area"><div class="joystick-base"><div class="joystick-thumb" id="joystick-thumb"></div></div></div>
<div class="action-btn" id="shoot-btn"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg></div>
<div class="melee-btn" id="melee-btn"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/></svg></div>
<div class="interact-mobile-btn" id="interact-mobile-btn">E</div>
<div class="damage-flash" id="damage-flash"></div>

<!-- 国内 CDN 加载 Three.js -->
<script src="https://cdn.bootcdn.net/ajax/libs/three.js/r128/three.min.js"></script>
<script>if(typeof THREE==='undefined') document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
<script>if(typeof THREE==='undefined') document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>');</script>
<script>setTimeout(function(){if(typeof THREE==='undefined'){document.getElementById('loading-status').innerText='Three.js加载失败，请刷新页面';}},8000);</script>

<script>
(function(){
    // ============ 横屏检测 ============
    const orientationTip = document.getElementById('orientation-tip');
    function checkOrientation() { orientationTip.style.display = window.innerHeight > window.innerWidth ? 'flex' : 'none'; }
    window.addEventListener('resize', checkOrientation);
    checkOrientation();

    // ============ 等待 Three.js ============
    let threeReady = false;
    function waitThree() {
        if (typeof THREE !== 'undefined') {
            threeReady = true;
            initGame();
        } else {
            setTimeout(waitThree, 100);
        }
    }
    waitThree();

    // ============ 游戏主逻辑 ============
    function initGame() {
        try {
            // WebGL检测
            let glTest = document.createElement('canvas').getContext('webgl');
            if(!glTest) { alert("浏览器不支持WebGL"); return; }

            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            const PIXEL_RATIO = isMobile ? 1.0 : Math.min(window.devicePixelRatio, 2);
            
            // ---------- 核心变量 ----------
            let scene, camera, renderer, clock = new THREE.Clock(), raycaster = new THREE.Raycaster();
            let keyState = { w:0, s:0, a:0, d:0, e:0 };
            let cameraRotation = { yaw: 0, pitch: 0 };
            let health=100, sanity=100, stamina=100, almondWater=0;
            let currentDistance=0, lastPosition={x:0,z:0};
            let currentWeapon=1; // 0手枪 1冲锋枪 2MG3
            let ammo={pistol:16, smg:50, mg3:0};
            let maxAmmo={pistol:200, smg:200, mg3:200};
            let fireRate={pistol:0.35, smg:0.12, mg3:0.08};
            let lastShootTime=0;
            let weaponModel=null;
            let gameStarted=false, startRoomGroup=null, doorMeshes=[];
            let joystickActive=false, joystickVec={x:0,z:0};
            let supplyRooms=[], exitDoor=null;
            let soundEvents=[];
            let cluesCollected=0, hasTape=false, tapeObject=null, tapeDigit="";
            let graffitiDigits=[], corpseDigits=[], corpses=[];
            let smilers=[], mimics=[], dolls=[], shadows=[]; // 四种实体
            let mouseLookActive = false;
            let lastMouseX=0, lastMouseY=0;

            // DOM 元素
            const loadingDiv = document.getElementById('loading');
            const startOverlay = document.getElementById('start-overlay');
            const uiDiv = document.getElementById('ui');
            const interactHint = document.getElementById('interact-hint');
            const chatMessages = document.getElementById('chat-messages');
            const chatInput = document.getElementById('chat-input');
            const healthSpan = document.getElementById('health-val');
            const sanitySpan = document.getElementById('sanity-val');
            const staminaSpan = document.getElementById('stamina-val');
            const waterSpan = document.getElementById('water-val');
            const distanceSpan = document.getElementById('distance-val');
            const exitDistSpan = document.getElementById('exit-dist');
            const ammoValSpan = document.getElementById('ammo-val');
            const ammoMaxSpan = document.getElementById('ammo-max');
            const clueCountSpan = document.getElementById('clue-count');
            const passwordInput = document.getElementById('password-input');
            const submitPasswordBtn = document.getElementById('submit-password');
            const tapeTextDiv = document.getElementById('tape-text');
            const tapeViewer = document.getElementById('tape-viewer');

            function addChatMessage(sender, msg) {
                let div = document.createElement('div');
                div.innerHTML = `<span style="color:#88ff88">[${sender}]</span> ${msg}`;
                chatMessages.appendChild(div);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function updateUI() {
                healthSpan.innerText = Math.floor(health);
                sanitySpan.innerText = Math.floor(sanity);
                staminaSpan.innerText = Math.floor(stamina);
                waterSpan.innerText = almondWater;
                distanceSpan.innerText = Math.floor(currentDistance);
                let remain = 15000 - (currentDistance % 15000);
                exitDistSpan.innerText = remain > 1000 ? (remain/1000).toFixed(1)+'km' : remain+'m';
                let cur = currentWeapon===0 ? ammo.pistol : (currentWeapon===1 ? ammo.smg : ammo.mg3);
                let max = currentWeapon===0 ? maxAmmo.pistol : (currentWeapon===1 ? maxAmmo.smg : maxAmmo.mg3);
                ammoValSpan.innerText = cur;
                ammoMaxSpan.innerText = max;
                document.getElementById('weap-pistol').classList.toggle('active', currentWeapon===0);
                document.getElementById('weap-smg').classList.toggle('active', currentWeapon===1);
                document.getElementById('weap-mg3').classList.toggle('active', currentWeapon===2);
                clueCountSpan.innerText = cluesCollected;
            }

            function takeDamage(amt) {
                if(!gameStarted) return;
                health = Math.max(0, health - amt);
                sanity = Math.max(0, sanity - amt*0.4);
                updateUI();
                let flash = document.getElementById('damage-flash');
                flash.style.backgroundColor = 'rgba(180,0,0,0.7)';
                setTimeout(() => flash.style.backgroundColor = 'rgba(180,0,0,0)', 120);
                if(health <= 0) { alert("你已死亡，刷新页面重来"); location.reload(); }
            }

            // ---------- 武器模型 ----------
            function createPistol() { let g=new THREE.Group(); let body=new THREE.Mesh(new THREE.BoxGeometry(0.19,0.13,0.48), new THREE.MeshStandardMaterial({color:0x333333,metalness:0.9})); body.position.set(0,0,0.1); g.add(body); let grip=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.22,0.3), new THREE.MeshStandardMaterial({color:0x5a3a2a})); grip.position.set(0,-0.13,-0.1); g.add(grip); return g; }
            function createSMG() { let g=new THREE.Group(); let body=new THREE.Mesh(new THREE.BoxGeometry(0.24,0.15,0.58), new THREE.MeshStandardMaterial({color:0x2a2a2a,metalness:0.85})); body.position.set(0,0,0.05); g.add(body); let mag=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.24,0.13), new THREE.MeshStandardMaterial({color:0x553322})); mag.position.set(0,-0.18,0); g.add(mag); let barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,0.48,12), new THREE.MeshStandardMaterial({color:0x111111,metalness:0.95})); barrel.rotation.z=Math.PI/2; barrel.position.set(0,0.03,0.48); g.add(barrel); return g; }
            function createMG3() { let g=new THREE.Group(); let body=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.18,0.7), new THREE.MeshStandardMaterial({color:0x2a2a2a,metalness:0.8})); body.position.set(0,0,0.05); g.add(body); let barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,0.6,12), new THREE.MeshStandardMaterial({color:0x111111,metalness:0.95})); barrel.rotation.z=Math.PI/2; barrel.position.set(0,0.05,0.6); g.add(barrel); return g; }

            function switchWeapon(idx) {
                if(idx===currentWeapon) return;
                currentWeapon=idx;
                if(weaponModel) camera.remove(weaponModel);
                if(currentWeapon===0) weaponModel=createPistol();
                else if(currentWeapon===1) weaponModel=createSMG();
                else weaponModel=createMG3();
                weaponModel.position.set(0.38, -0.27, -0.48);
                weaponModel.rotation.x = 0.12; weaponModel.rotation.z = -0.12;
                camera.add(weaponModel);
                updateUI();
            }
            window.gameSwitchWeapon = switchWeapon;

            // ---------- 射击与近战 ----------
            function shoot() {
                if(!gameStarted) return;
                let cur = currentWeapon===0 ? ammo.pistol : (currentWeapon===1 ? ammo.smg : ammo.mg3);
                if(cur <= 0) return;
                let now = Date.now()/1000;
                let rate = currentWeapon===0 ? fireRate.pistol : (currentWeapon===1 ? fireRate.smg : fireRate.mg3);
                if(now - lastShootTime < rate) return;
                lastShootTime = now;
                if(currentWeapon===0) ammo.pistol--; else if(currentWeapon===1) ammo.smg--; else ammo.mg3--;
                updateUI();
                cameraRotation.pitch += 0.045;
                if(weaponModel) { weaponModel.position.y = -0.12; setTimeout(() => { if(weaponModel) weaponModel.position.y = 0; }, 80); }
                // 枪口闪光
                let flashLight = new THREE.PointLight(0xffaa66, 1.5, 6);
                flashLight.position.set(0.5, -0.1, 0.7);
                if(weaponModel) weaponModel.add(flashLight);
                setTimeout(() => { if(weaponModel) weaponModel.remove(flashLight); }, 80);
                // 声音事件
                soundEvents.push({ pos: camera.position.clone(), radius: 40, time: now });
                // 射线检测
                raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
                let dmg = 1; // 对实体伤害1，需要200发击杀
                for(let m of smilers) {
                    let hits = raycaster.intersectObject(m.mesh, true);
                    if(hits.length > 0) {
                        m.health -= dmg; m.detection += 3;
                        if(m.health <= 0) { scene.remove(m.mesh); smilers = smilers.filter(x => x !== m); }
                        break;
                    }
                }
            }
            function meleeAttack() {
                if(!gameStarted) return;
                raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
                for(let m of smilers) {
                    let hits = raycaster.intersectObject(m.mesh, true);
                    if(hits.length > 0 && hits[0].distance < 2) {
                        m.health -= 30;
                        if(m.health <= 0) { scene.remove(m.mesh); smilers = smilers.filter(x => x !== m); }
                        break;
                    }
                }
            }

            // ---------- 四种实体（笑魇完整，其他为占位可扩展） ----------
            class Smiler {
                constructor(pos) {
                    this.mesh = this.createModel();
                    this.mesh.position.copy(pos);
                    scene.add(this.mesh);
                    this.health = 200; this.speed = 6;
                    this.attackCd = 0; this.detection = 0; this.id = Math.random();
                }
                createModel() {
                    const g = new THREE.Group();
                    const mat = new THREE.MeshStandardMaterial({color:0xeeeeee, emissive:0x442222, roughness:0.2});
                    const body = new THREE.Mesh(new THREE.SphereGeometry(0.55,32,32), mat);
                    body.position.y = 0.6; g.add(body);
                    const head = new THREE.Mesh(new THREE.SphereGeometry(0.48,32,32), mat);
                    head.position.y = 1.2; g.add(head);
                    const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.4,0.06,16,32,Math.PI), new THREE.MeshStandardMaterial({color:0x000000,emissive:0x330000}));
                    mouth.rotation.x = 0.2; mouth.position.set(0,1.15,0.5); g.add(mouth);
                    const eyeMat = new THREE.MeshStandardMaterial({color:0xff0000, emissive:0xff2200});
                    const el = new THREE.Mesh(new THREE.SphereGeometry(0.12,16,16), eyeMat);
                    el.position.set(-0.18,1.35,0.55); g.add(el);
                    const er = el.clone(); er.position.set(0.18,1.35,0.55); g.add(er);
                    return g;
                }
                update(delta, playerPos) {
                    this.attackCd -= delta;
                    let dist = this.mesh.position.distanceTo(playerPos);
                    if(dist < 25) {
                        let dir = new THREE.Vector3().subVectors(playerPos, this.mesh.position).normalize();
                        this.mesh.position.x += dir.x * this.speed * delta;
                        this.mesh.position.z += dir.z * this.speed * delta;
                        this.mesh.lookAt(playerPos);
                        if(dist < 1.5 && this.attackCd <= 0) { takeDamage(22); this.attackCd = 1.2; }
                    }
                    this.mesh.position.y = 0.65 + Math.sin(performance.now()*0.005)*0.05;
                }
            }
            // 其他实体占位（可扩展真实AI）
            class Mimic { constructor(pos){ this.mesh=new THREE.Group(); this.update=()=>{} } }
            class Doll { constructor(pos){ this.mesh=new THREE.Group(); this.update=()=>{} } }
            class Shadow { constructor(pos){ this.mesh=new THREE.Group(); this.update=()=>{} } }

            // ---------- 世界生成 ----------
            function createStartRoom() {
                const g = new THREE.Group();
                const size = 14;
                const wallMat = new THREE.MeshStandardMaterial({color:0xebc87e, roughness:0.6});
                const floorMat = new THREE.MeshStandardMaterial({color:0xc8a86a, roughness:0.8});
                const ceilMat = new THREE.MeshStandardMaterial({color:0xf5e6b0, roughness:0.7});
                const floor = new THREE.Mesh(new THREE.PlaneGeometry(size,size), floorMat);
                floor.rotation.x = -Math.PI/2; g.add(floor);
                const ceil = new THREE.Mesh(new THREE.PlaneGeometry(size,size), ceilMat);
                ceil.rotation.x = Math.PI/2; ceil.position.y = 3.5; g.add(ceil);
                const walls = [[0,1.75,-size/2,0],[0,1.75,size/2,0],[-size/2,1.75,0,Math.PI/2],[size/2,1.75,0,Math.PI/2]];
                for(let w of walls) {
                    const wall = new THREE.Mesh(new THREE.BoxGeometry(size,3.5,0.25), wallMat);
                    wall.position.set(w[0], w[1], w[2]); wall.rotation.y = w[3];
                    g.add(wall);
                }
                // 涂鸦数字线索（3个）
                const clueNums = ["3","7","1","8","5","2","9","4"];
                for(let i=0;i<3;i++) {
                    let num = clueNums[Math.floor(Math.random()*clueNums.length)];
                    graffitiDigits.push(num);
                    let canvas = document.createElement('canvas'); canvas.width=256; canvas.height=256;
                    let ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#8B4513'; ctx.fillRect(0,0,256,256);
                    ctx.font = 'bold 100px monospace'; ctx.fillStyle = '#ffcc77'; ctx.textAlign='center'; ctx.textBaseline='middle';
                    ctx.fillText(num, 128, 128);
                    let tex = new THREE.CanvasTexture(canvas);
                    let plane = new THREE.Mesh(new THREE.PlaneGeometry(1.2,1.2), new THREE.MeshBasicMaterial({map:tex}));
                    plane.position.set(-2 + i*2, 2.2, -size/2+0.15);
                    g.add(plane);
                }
                // 5个门（前、左、右各一，再加两个侧门）
                const doorMat2 = new THREE.MeshStandardMaterial({color:0xaa8866});
                const doorPositions = [
                    [0, size/2-0.1, 0],
                    [-size/2+0.1, 0, Math.PI/2],
                    [size/2-0.1, 0, Math.PI/2],
                    [-size/2+0.1, -3, Math.PI/2],
                    [size/2-0.1, -3, Math.PI/2]
                ];
                for(let d of doorPositions) {
                    let df = new THREE.Mesh(new THREE.BoxGeometry(1.6,2.6,0.15), doorMat2);
                    df.position.set(d[0], 1.3, d[1]); df.rotation.y = d[2];
                    g.add(df);
                    let knob = new THREE.Mesh(new THREE.SphereGeometry(0.08,8,8), new THREE.MeshStandardMaterial({color:0xccaa77}));
                    knob.position.set(d[0]+(d[2]===0?0.5:0), 1.3, d[1]+(d[2]===0?0.1:0.5));
                    g.add(knob);
                    doorMeshes.push({mesh:df});
                }
                // 灯光
                let light = new THREE.PointLight(0xffdd99, 1.2, 20);
                light.position.set(0,3,0); g.add(light);
                return g;
            }

            function createPBRTexture(type) {
                let canvas = document.createElement('canvas'); canvas.width=512; canvas.height=512;
                let ctx = canvas.getContext('2d');
                let base = type==='wall' ? '#ebc87e' : (type==='floor' ? '#c8a86a' : '#f5e6b0');
                ctx.fillStyle = base; ctx.fillRect(0,0,512,512);
                for(let i=0;i<3000;i++) {
                    ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.15})`;
                    ctx.fillRect(Math.random()*512, Math.random()*512, 2+Math.random()*4, 2+Math.random()*4);
                }
                let tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(4,4);
                return tex;
            }
            const CHUNK_SIZE = 80;
            let loadedChunks = new Map();
            function generateChunk(cx, cz) {
                const group = new THREE.Group();
                const startX = cx*CHUNK_SIZE, startZ = cz*CHUNK_SIZE;
                const cell = 8, grid = 10;
                const wallMat = new THREE.MeshStandardMaterial({map:createPBRTexture('wall'), roughness:0.8});
                const floorMat = new THREE.MeshStandardMaterial({map:createPBRTexture('floor'), roughness:0.9});
                const ceilMat = new THREE.MeshStandardMaterial({map:createPBRTexture('ceil'), roughness:0.8});
                for(let i=0;i<grid;i++) {
                    for(let j=0;j<grid;j++) {
                        const x = startX + i*cell, z = startZ + j*cell;
                        const isWall = (Math.sin(i*1.3 + cz*5) + Math.cos(j*1.7 + cx*3)) > 0.3;
                        if(i===0 || i===grid-1 || j===0 || j===grid-1 || isWall) {
                            const wall = new THREE.Mesh(new THREE.BoxGeometry(cell,4,0.3), wallMat);
                            wall.position.set(x+cell/2, 2, z+cell/2);
                            group.add(wall);
                        }
                        const floor = new THREE.Mesh(new THREE.PlaneGeometry(cell,cell), floorMat);
                        floor.rotation.x = -Math.PI/2; floor.position.set(x+cell/2,0,z+cell/2);
                        group.add(floor);
                        const ceil = new THREE.Mesh(new THREE.PlaneGeometry(cell,cell), ceilMat);
                        ceil.rotation.x = Math.PI/2; ceil.position.set(x+cell/2,4,z+cell/2);
                        group.add(ceil);
                        if(!isWall && Math.random()<0.1) {
                            let light = new THREE.PointLight(0xffdd99, 0.6, 15);
                            light.position.set(x+cell/2, 3, z+cell/2);
                            group.add(light);
                        }
                    }
                }
                return group;
            }
            function updateChunks() {
                const pcx = Math.floor(camera.position.x / CHUNK_SIZE);
                const pcz = Math.floor(camera.position.z / CHUNK_SIZE);
                for(let dx=-2;dx<=2;dx++) for(let dz=-2;dz<=2;dz++) {
                    const key = (pcx+dx)+','+(pcz+dz);
                    if(!loadedChunks.has(key)) { const chunk = generateChunk(pcx+dx,pcz+dz); scene.add(chunk); loadedChunks.set(key, chunk); }
                }
                for(let [k,grp] of loadedChunks) {
                    let [cx,cz] = k.split(',').map(Number);
                    if(Math.abs(cx-pcx)>3 || Math.abs(cz-pcz)>3) { scene.remove(grp); loadedChunks.delete(k); }
                }
            }

            // ---------- 补给站、尸体、录像带 ----------
            function spawnSupplyStation(pos) {
                const g = new THREE.Group();
                let base = new THREE.Mesh(new THREE.BoxGeometry(2,0.6,1.5), new THREE.MeshStandardMaterial({color:0x8B6914}));
                base.position.y = 0.3; g.add(base);
                let glow = new THREE.PointLight(0xffaa66, 1, 12);
                glow.position.set(0, 0.8, 0); g.add(glow);
                g.position.copy(pos); scene.add(g);
                supplyRooms.push({mesh:g, pos, used:false});
            }
            function createDeadSoldier(pos) {
                const g = new THREE.Group();
                let body = new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,1.3,8), new THREE.MeshStandardMaterial({color:0x4a5a2a}));
                body.position.y = 0.65; g.add(body);
                let head = new THREE.Mesh(new THREE.SphereGeometry(0.32,16,16), new THREE.MeshStandardMaterial({color:0xddccaa}));
                head.position.y = 1.4; g.add(head);
                g.position.copy(pos); g.rotation.z = Math.PI/2 * 0.7;
                scene.add(g);
                let digit = Math.floor(Math.random()*10).toString();
                return {mesh:g, digit, collected:false, pos};
            }
            let lastCorpse=0, lastSupply=0;
            function checkSpawning() {
                let walked = currentDistance;
                // 尸体每500米
                let corpseStep = Math.floor(walked/500);
                if(corpseStep > lastCorpse) {
                    lastCorpse = corpseStep;
                    let angle = Math.random()*Math.PI*2;
                    let pos = new THREE.Vector3(camera.position.x+Math.cos(angle)*25, 0, camera.position.z+Math.sin(angle)*25);
                    corpses.push(createDeadSoldier(pos));
                    addChatMessage('系统', '发现尸体，靠近按 E 查看纸条');
                }
                // 补给站每1000米（1公里）
                let supplyStep = Math.floor(walked/1000);
                if(supplyStep > lastSupply) {
                    lastSupply = supplyStep;
                    let angle = Math.random()*Math.PI*2;
                    let pos = new THREE.Vector3(camera.position.x+Math.cos(angle)*28, 0, camera.position.z+Math.sin(angle)*28);
                    spawnSupplyStation(pos);
                }
                // 出口门每15000米（15公里）
                if(!exitDoor && walked > 15000) {
                    let angle = Math.random()*Math.PI*2;
                    let pos = new THREE.Vector3(Math.cos(angle)*300, 0, Math.sin(angle)*300);
                    let dg = new THREE.Group();
                    let frame = new THREE.Mesh(new THREE.BoxGeometry(2.2,3.2,0.25), new THREE.MeshStandardMaterial({color:0x228B22}));
                    frame.position.y = 1.6; dg.add(frame);
                    let glow = new THREE.PointLight(0x33ff99, 2, 25);
                    glow.position.set(0, 1.6, 0.4); dg.add(glow);
                    dg.position.copy(pos); scene.add(dg);
                    exitDoor = {mesh:dg, pos};
                }
                // 录像带（只生成一次）
                if(!tapeObject && !hasTape && walked > 500) {
                    let angle = Math.random()*Math.PI*2;
                    let pos = new THREE.Vector3(camera.position.x+Math.cos(angle)*20, 0.3, camera.position.z+Math.sin(angle)*20);
                    let box = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.25,0.7), new THREE.MeshStandardMaterial({color:0xcc3333, emissive:0x441111}));
                    box.position.copy(pos); scene.add(box);
                    tapeObject = box;
                }
            }

            // ---------- 交互 ----------
            function handleInteractions() {
                if(!gameStarted) {
                    for(let d of doorMeshes) {
                        let wp = new THREE.Vector3();
                        d.mesh.getWorldPosition(wp);
                        if(camera.position.distanceTo(wp) < 2.5) {
                            interactHint.style.display = 'block';
                            interactHint.innerText = '按 E 或点击 [E] 进入后室';
                            if(keyState.e || window.triggerInteract) {
                                startGame();
                                return;
                            }
                        } else interactHint.style.display = 'none';
                    }
                    return;
                }
                // 补给
                for(let i=0;i<supplyRooms.length;i++) {
                    let s = supplyRooms[i];
                    if(s.used) continue;
                    if(camera.position.distanceTo(s.pos) < 2.5) {
                        interactHint.style.display = 'block';
                        interactHint.innerText = '按 E 补给 (弹药+生命)';
                        if(keyState.e || window.triggerInteract) {
                            s.used=true; scene.remove(s.mesh);
                            ammo.pistol = Math.min(maxAmmo.pistol, ammo.pistol+30);
                            ammo.smg = Math.min(maxAmmo.smg, ammo.smg+30);
                            ammo.mg3 = Math.min(maxAmmo.mg3, ammo.mg3+50);
                            health = Math.min(100, health+30); sanity = Math.min(100, sanity+20);
                            updateUI(); addChatMessage('系统', '获得补给');
                            supplyRooms.splice(i,1);
                            window.triggerInteract = false;
                        }
                        return;
                    }
                }
                // 尸体
                for(let c of corpses) {
                    if(c.collected) continue;
                    if(camera.position.distanceTo(c.pos) < 2) {
                        interactHint.style.display = 'block';
                        interactHint.innerText = '按 E 查看纸条';
                        if(keyState.e || window.triggerInteract) {
                            c.collected = true;
                            corpseDigits.push(c.digit);
                            cluesCollected++;
                            updateUI();
                            addChatMessage('系统', `纸条数字: ${c.digit}`);
                            window.triggerInteract = false;
                        }
                        return;
                    }
                }
                // 录像带
                if(tapeObject && !hasTape && camera.position.distanceTo(tapeObject.position) < 2) {
                    interactHint.style.display = 'block';
                    interactHint.innerText = '按 E 拾取录像带';
                    if(keyState.e || window.triggerInteract) {
                        scene.remove(tapeObject); tapeObject=null;
                        hasTape = true; tapeDigit = Math.floor(Math.random()*10).toString();
                        cluesCollected++;
                        updateUI();
                        addChatMessage('系统', `录像带数字: ${tapeDigit}`);
                        tapeTextDiv.innerHTML = `<p>画面闪烁，数字 <b>${tapeDigit}</b></p><p>涂鸦: ${graffitiDigits.join(',')}</p><p>尸体: ${corpseDigits.join(',')}</p>`;
                        tapeViewer.style.display = 'flex';
                        window.triggerInteract = false;
                    }
                    return;
                }
                // 出口
                if(exitDoor && camera.position.distanceTo(exitDoor.pos) < 3) {
                    if(cluesCollected < 5) {
                        interactHint.style.display = 'block';
                        interactHint.innerText = `还需 ${5-cluesCollected} 个线索`;
                    } else {
                        interactHint.style.display = 'block';
                        interactHint.innerText = '按 E 输入密码';
                        if(keyState.e || window.triggerInteract) {
                            document.getElementById('password-panel').style.display = 'flex';
                            window.triggerInteract = false;
                        }
                    }
                    return;
                }
                interactHint.style.display = 'none';
            }

            // ---------- 输入控制 ----------

            // ---------- 移动与体力 ----------
            function updateMovement(delta) {
                if(!gameStarted) return;
                let moveX=0, moveZ=0;
                if(keyState.w) moveZ-=1; if(keyState.s) moveZ+=1; if(keyState.a) moveX-=1; if(keyState.d) moveX+=1;
                if(joystickActive) { moveX = joystickVec.x; moveZ = joystickVec.z; }
                if(moveX!==0 || moveZ!==0) {
                    let speed = 7;
                    if(stamina<20) speed *= 0.6;
                    let forward = new THREE.Vector3(-Math.sin(cameraRotation.yaw), 0, -Math.cos(cameraRotation.yaw));
                    let right = new THREE.Vector3(Math.cos(cameraRotation.yaw), 0, -Math.sin(cameraRotation.yaw));
                    let vel = new THREE.Vector3().addScaledVector(forward, moveZ).addScaledVector(right, moveX).normalize();
                    camera.position.x += vel.x * speed * delta;
                    camera.position.z += vel.z * speed * delta;
                    let dx = camera.position.x - lastPosition.x;
                    let dz = camera.position.z - lastPosition.z;
                    currentDistance += Math.sqrt(dx*dx+dz*dz);
                    lastPosition.x = camera.position.x; lastPosition.z = camera.position.z;
                    stamina = Math.max(0, stamina - delta*12);
                } else stamina = Math.min(100, stamina + delta*8);
            }

            // ---------- 理智更新 ----------
            function updateSanity(delta) {
                let closest = 999;
                for(let e of smilers) closest = Math.min(closest, camera.position.distanceTo(e.mesh.position));
                if(closest < 15) sanity = Math.max(0, sanity - delta*6);
                else if(sanity < 100) sanity = Math.min(100, sanity + delta*3);
                updateUI();
            }

            // ---------- 动画循环 ----------
            let lastRenderTime = 0;
            function animate(now) {
                requestAnimationFrame(animate);
                let delta = Math.min(0.033, (now - lastRenderTime)/1000);
                if(delta <= 0) { lastRenderTime = now; return; }
                lastRenderTime = now;
                updateMovement(delta);
                if(gameStarted) {
                    updateChunks();
                    for(let s of smilers) s.update(delta, camera.position);
                    if(Math.random()<0.005 && smilers.length<4) {
                        let angle = Math.random()*Math.PI*2;
                        let pos = new THREE.Vector3(camera.position.x+Math.cos(angle)*40, 0, camera.position.z+Math.sin(angle)*40);
                        smilers.push(new Smiler(pos));
                    }
                    checkSpawning();
                    updateSanity(delta);
                    soundEvents = soundEvents.filter(ev => (now/1000 - ev.time) < 2);
                }
                handleInteractions();
                camera.rotation.order = 'YXZ';
                camera.rotation.y = cameraRotation.yaw;
                camera.rotation.x = cameraRotation.pitch;
                renderer.render(scene, camera);
            }

            // ---------- 窗口调整 ----------
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // 启动动画
            requestAnimationFrame(animate);
            
        } catch(err) {
            console.error(err);
            alert("游戏启动失败: " + err.message);
        }
    }
})();
</script>
</body>
</html>
