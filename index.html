<script>
(function() {
    const statusEl = document.getElementById('loading-status');

    const CDN = {
        three: [
            'https://cdn.bootcdn.net/ajax/libs/three.js/r128/three.min.js',
            'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
            'https://unpkg.com/three@0.128.0/build/three.min.js'
        ],
        EffectComposer: [
            'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js',
            'https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js',
            'https://cdn.bootcdn.net/ajax/libs/three.js/r128/examples/js/postprocessing/EffectComposer.js'
        ],
        RenderPass: [
            'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js',
            'https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js',
            'https://cdn.bootcdn.net/ajax/libs/three.js/r128/examples/js/postprocessing/RenderPass.js'
        ],
        ShaderPass: [
            'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js',
            'https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js',
            'https://cdn.bootcdn.net/ajax/libs/three.js/r128/examples/js/postprocessing/ShaderPass.js'
        ],
        CopyShader: [
            'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js',
            'https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js',
            'https://cdn.bootcdn.net/ajax/libs/three.js/r128/examples/js/shaders/CopyShader.js'
        ],
        supabase: [
            'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js',
            'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js',
            'https://cdn.bootcdn.net/ajax/libs/supabase/2.0.0/supabase.min.js'
        ]
    };

    function loadScriptFromList(name, urls) {
        return new Promise((resolve, reject) => {
            let index = 0;
            function tryNext() {
                if (index >= urls.length) {
                    return reject(new Error(`所有 CDN 都无法加载 ${name}`));
                }
                const url = urls[index++];
                const script = document.createElement('script');
                script.src = url;
                const timeout = setTimeout(() => {
                    script.onerror = null; script.onload = null;
                    if (script.parentNode) script.parentNode.removeChild(script);
                    console.warn(`${name} 超时: ${url}`);
                    tryNext();
                }, 10000);
                script.onload = () => {
                    clearTimeout(timeout);
                    console.log(`${name} 加载成功: ${url}`);
                    resolve();
                };
                script.onerror = () => {
                    clearTimeout(timeout);
                    if (script.parentNode) script.parentNode.removeChild(script);
                    console.warn(`${name} 失败: ${url}`);
                    tryNext();
                };
                document.head.appendChild(script);
            }
            tryNext();
        });
    }

    async function loadAll() {
        statusEl.innerText = '正在加载 Three.js...';
        await loadScriptFromList('Three.js', CDN.three);
        statusEl.innerText = '正在加载后处理...';
        await Promise.all([
            loadScriptFromList('EffectComposer', CDN.EffectComposer),
            loadScriptFromList('RenderPass', CDN.RenderPass),
            loadScriptFromList('ShaderPass', CDN.ShaderPass),
            loadScriptFromList('CopyShader', CDN.CopyShader)
        ]);
        statusEl.innerText = '正在加载联机模块...';
        await loadScriptFromList('Supabase', CDN.supabase);
        statusEl.innerText = '引擎就绪，启动中...';
        initGame();
    }

    loadAll().catch(err => {
        statusEl.innerText = '资源加载失败，请刷新或检查网络';
        console.error(err);
    });
})();
</script>

    },
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
        varying vec2 vUv;
        uniform sampler2D tDiffuse;
        uniform sampler2D tPrevFrame;
        uniform vec2 uResolution;
        uniform float uBlend;
        void main() {
            vec4 current = texture2D(tDiffuse, vUv);
            vec4 prev = texture2D(tPrevFrame, vUv);
            gl_FragColor = mix(current, prev, uBlend);
        }`
};

                let f=new THREE.Mesh(new THREE.PlaneGeometry(cell,cell),fMat); f.rotation.x=-Math.PI/2; f.position.set(x+cell/2,0,z+cell/2); g.add(f);
                let c=new THREE.Mesh(new THREE.PlaneGeometry(cell,cell),cMat); c.rotation.x=Math.PI/2; c.position.set(x+cell/2,4,z+cell/2); g.add(c);
                if(!isDark&&!isWall&&Math.random()<0.12) { let l=new THREE.PointLight(0xffdd99,0.7,18); l.position.set(x+cell/2,3.2,z+cell/2); g.add(l); }
            }
            return g;
        }
        function updateChunks() {
            let pcx=Math.floor(camera.position.x/CHUNK_SIZE), pcz=Math.floor(camera.position.z/CHUNK_SIZE);
            for(let dx=-2;dx<=2;dx++) for(let dz=-2;dz<=2;dz++) { let k=(pcx+dx)+','+(pcz+dz); if(!loadedChunks.has(k)) { let ch=generateChunk(pcx+dx,pcz+dz); scene.add(ch); loadedChunks.set(k,ch); } }
            for(let [k,grp] of loadedChunks) { let [cx,cz]=k.split(',').map(Number); if(Math.abs(cx-pcx)>3||Math.abs(cz-pcz)>3) { scene.remove(grp); loadedChunks.delete(k); } }
        }
        function createDustParticles() {
            let count=300, pos=new Float32Array(count*3);
            for(let i=0;i<count;i++) { pos[i*3]=(Math.random()-0.5)*80; pos[i*3+1]=Math.random()*4; pos[i*3+2]=(Math.random()-0.5)*80; }
            let geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
            return new THREE.Points(geo,new THREE.PointsMaterial({color:0xccbb99,size:0.05,transparent:true,opacity:0.3,blending:THREE.AdditiveBlending,depthWrite:false}));
        }
        function createFlashlight() {
            let light=new THREE.SpotLight(0xffeedd,1.5,35,Math.PI/5,0.6,1.2); light.position.set(0,1.6,0); light.target.position.set(0,1.6,-1);
            camera.add(light); camera.add(light.target);
            return {light, target:light.target};
        }
        function toggleFlashlight() { flashlightOn=!flashlightOn; if(flashlightLight) flashlightLight.intensity=flashlightOn?1.5:0; flashlightBtn.innerText=flashlightOn?'🔦':'🔦✖'; }
        function spawnSupplyStation(pos) {
            let g=new THREE.Group();
            let b=new THREE.Mesh(new THREE.BoxGeometry(2,0.6,1.5),new THREE.MeshStandardMaterial({color:0x8B6914})); b.position.y=0.3; g.add(b);
            let gl=new THREE.PointLight(0xffaa66,1.2,15); gl.position.set(0,0.8,0); g.add(gl);
            let h=new THREE.Mesh(new THREE.SphereGeometry(0.5,8,8),new THREE.MeshBasicMaterial({color:0xffaa66,transparent:true,opacity:0.2})); h.position.set(0,0.8,0); g.add(h);
            g.position.copy(pos); scene.add(g); supplyRooms.push({mesh:g,pos,used:false});
        }
        function createDeadSoldier(pos) {
            let g=new THREE.Group();
            let b=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,1.3,8),new THREE.MeshStandardMaterial({color:0x4a5a2a})); b.position.y=0.65; g.add(b);
            let h=new THREE.Mesh(new THREE.SphereGeometry(0.32,16,16),new THREE.MeshStandardMaterial({color:0xddccaa})); h.position.y=1.4; g.add(h);
            g.position.copy(pos); g.rotation.z=Math.PI/2*0.7; scene.add(g);
            return {mesh:g, digit:Math.floor(Math.random()*10).toString(), collected:false, pos};
        }
        let lastCorpse=0, lastSupply=0, lastEntitySpawnDist=0;
        function checkSpawning() {
            let walked=currentDistance;
            let corpseStep=Math.floor(walked/500); if(corpseStep>lastCorpse) { lastCorpse=corpseStep; let a=Math.random()*Math.PI*2; corpses.push(createDeadSoldier(new THREE.Vector3(camera.position.x+Math.cos(a)*25,0,camera.position.z+Math.sin(a)*25))); addChatMessage('系统','发现尸体，靠近按 E 查看纸条'); }
            let supStep=Math.floor(walked/1000); if(supStep>lastSupply) { lastSupply=supStep; let a=Math.random()*Math.PI*2; spawnSupplyStation(new THREE.Vector3(camera.position.x+Math.cos(a)*28,0,camera.position.z+Math.sin(a)*28)); }
            if(!exitDoor && walked>15000) { let a=Math.random()*Math.PI*2; let p=new THREE.Vector3(Math.cos(a)*300,0,Math.sin(a)*300); let dg=new THREE.Group(); let f=new THREE.Mesh(new THREE.BoxGeometry(2.2,3.2,0.25),new THREE.MeshStandardMaterial({color:0x228B22,metalness:0.2})); f.position.y=1.6; dg.add(f); let gl=new THREE.PointLight(0x33ff99,2.5,30); gl.position.set(0,1.6,0.4); dg.add(gl); dg.position.copy(p); scene.add(dg); exitDoor={mesh:dg,pos:p}; }
            if(!tapeObject && !hasTape && walked>500) { let a=Math.random()*Math.PI*2; let p=new THREE.Vector3(camera.position.x+Math.cos(a)*20,0.3,camera.position.z+Math.sin(a)*20); let box=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.25,0.7),new THREE.MeshStandardMaterial({color:0xcc3333,emissive:0x441111})); box.position.copy(p); scene.add(box); tapeObject=box; }
            let entityStep=Math.floor(walked/300); if(entityStep>lastEntitySpawnDist) { lastEntitySpawnDist=entityStep; let a=Math.random()*Math.PI*2,d=30+Math.random()*20,p=new THREE.Vector3(camera.position.x+Math.cos(a)*d,0,camera.position.z+Math.sin(a)*d); let r=Math.random(),e; if(r<0.25) e=new Smiler(p); else if(r<0.5) e=new Mimic(p); else if(r<0.75) e=new Doll(p); else e=new Shadow(p); if(e instanceof Smiler) smilers.push(e); else if(e instanceof Mimic) mimics.push(e); else if(e instanceof Doll) dolls.push(e); else shadows.push(e); addChatMessage('系统','你感觉到有什么东西在靠近... (300m)'); }
        }
        function handleInteractions() {
            if(!gameStarted) return;
            for(let i=0;i<supplyRooms.length;i++) { let s=supplyRooms[i]; if(s.used) continue; if(camera.position.distanceTo(s.pos)<2.5) { interactHint.style.display='block'; interactHint.innerText='按 E 补给 (弹药+生命)'; if(keyState.e || window.triggerInteract) { s.used=true; scene.remove(s.mesh); ammo.pistol=Math.min(maxAmmo.pistol,ammo.pistol+30); ammo.smg=Math.min(maxAmmo.smg,ammo.smg+30); ammo.mg3=Math.min(maxAmmo.mg3,ammo.mg3+50); health=Math.min(100,health+30); sanity=Math.min(100,sanity+20); updateUI(); addChatMessage('系统','获得补给'); supplyRooms.splice(i,1); window.triggerInteract=false; } return; } }
            for(let c of corpses) { if(c.collected) continue; if(camera.position.distanceTo(c.pos)<2) { interactHint.style.display='block'; interactHint.innerText='按 E 查看纸条'; if(keyState.e || window.triggerInteract) { c.collected=true; corpseDigits.push(c.digit); cluesCollected++; updateUI(); addChatMessage('系统',`纸条数字: ${c.digit}`); window.triggerInteract=false; } return; } }
            if(tapeObject && !hasTape && camera.position.distanceTo(tapeObject.position)<2) { interactHint.style.display='block'; interactHint.innerText='按 E 拾取录像带'; if(keyState.e || window.triggerInteract) { scene.remove(tapeObject); tapeObject=null; hasTape=true; tapeDigit=Math.floor(Math.random()*10).toString(); cluesCollected++; updateUI(); addChatMessage('系统',`录像带数字: ${tapeDigit}`); tapeTextDiv.innerHTML=`<p>画面闪烁，数字 <b>${tapeDigit}</b></p><p>涂鸦: ${graffitiDigits.join(',')}</p><p>尸体: ${corpseDigits.join(',')}</p>`; tapeViewer.style.display='flex'; window.triggerInteract=false; } return; }
            if(exitDoor && camera.position.distanceTo(exitDoor.pos)<3) { if(cluesCollected<5) { interactHint.style.display='block'; interactHint.innerText=`还需 ${5-cluesCollected} 个线索`; } else { interactHint.style.display='block'; interactHint.innerText='按 E 输入密码'; if(keyState.e || window.triggerInteract) { document.getElementById('password-panel').style.display='flex'; window.triggerInteract=false; } } return; }
            interactHint.style.display='none';
        }

        async function initOnline() {
            if(!enableOnline || typeof supabase === 'undefined') return;
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const { data, error } = await supabaseClient.auth.signInAnonymously();
                if(error) { console.warn('Supabase 匿名登录失败', error); return; }
                currentUser = data.user; online = true; addChatMessage('系统', '联机已连接');
                setInterval(syncPlayers, 2000);
            } catch(e) { console.warn('联机初始化失败', e); }
        }
        async function syncPlayers() {
            if(!online || !currentUser) return;
            try {
                await supabaseClient.from('players').upsert({
                    user_id: currentUser.id, name: '流浪者', pos_x: camera.position.x, pos_z: camera.position.z, rot_y: cameraRotation.yaw, weapon: currentWeapon, health: health, sanity: sanity, stamina: stamina, almond_water: almondWater, is_dead: health <= 0, death_x: health <= 0 ? camera.position.x : 0, death_z: health <= 0 ? camera.position.z : 0, last_seen: new Date()
                });
                const { data } = await supabaseClient.from('players').select('*').neq('user_id', currentUser.id);
                if(data) {
                    for(let p of data) {
                        if(!players.has(p.user_id)) {
                            let model = createRemotePlayerModel();
                            model.position.set(p.pos_x, 1.65, p.pos_z); model.rotation.y = p.rot_y;
                            scene.add(model); players.set(p.user_id, {mesh: model, name: p.name});
                        } else {
                            let pl = players.get(p.user_id);
                            pl.mesh.position.set(p.pos_x, 1.65, p.pos_z); pl.mesh.rotation.y = p.rot_y;
                        }
                    }
                }
                for(let [id, pl] of players) {
                    let found = data ? data.find(p => p.user_id === id) : null;
                    if(!found) { scene.remove(pl.mesh); players.delete(id); }
                }
            } catch(e) {}
        }

        function startGame() {
            gameStarted = true;
            startOverlay.style.display = 'none';
            uiDiv.classList.add('active');
            scene.remove(startRoomGroup);
            updateChunks();
            switchWeapon(1);
            for(let i=0;i<3;i++) { let a=Math.random()*Math.PI*2; let p=new THREE.Vector3(camera.position.x+Math.cos(a)*35,0,camera.position.z+Math.sin(a)*35); let r=Math.random(); if(r<0.25) smilers.push(new Smiler(p)); else if(r<0.5) mimics.push(new Mimic(p)); else if(r<0.75) dolls.push(new Doll(p)); else shadows.push(new Shadow(p)); }
            cluesCollected = graffitiDigits.length;
            updateUI();
            addChatMessage('系统', `进入后室。涂鸦数字: ${graffitiDigits.join(',')}`);
            dustParticles = createDustParticles();
            scene.add(dustParticles);
            lastEntitySpawnDist = Math.floor(currentDistance / 300);
            let flashData = createFlashlight();
            flashlightLight = flashData.light;
            flashlightTarget = flashData.target;
            flashlightOn = true; flashlightLight.intensity = 1.5; flashlightBtn.innerText = '🔦';
            initOnline();
        }

        scene = new THREE.Scene(); scene.background = new THREE.Color(0x1a140f); scene.fog = new THREE.FogExp2(0x1a140f, 0.005);
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 400);
        camera.position.set(0, 1.65, 5.5); cameraRotation.yaw = Math.PI; lastPosition={x:0,z:5.5};
        renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
        renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(PIXEL_RATIO);
        renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        let reflectMat = new THREE.MeshStandardMaterial({color:0x1a140f, roughness:0.5, metalness:0.8});
        let reflectPlane = new THREE.Mesh(new THREE.PlaneGeometry(1000,1000), reflectMat);
        reflectPlane.rotation.x = -Math.PI/2; reflectPlane.position.y = -0.01; scene.add(reflectPlane);

        rtPrev = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat });
        taaComposer = new THREE.EffectComposer(renderer);
        let renderScene = new THREE.RenderPass(scene, camera);
        taaPass = new THREE.ShaderPass(THREE.TAAShader);
        taaPass.uniforms.tPrevFrame.value = rtPrev.texture;
        taaPass.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
        let copyPass = new THREE.ShaderPass(THREE.CopyShader);
        copyPass.renderToScreen = true;
        taaComposer.addPass(renderScene);
        taaComposer.addPass(taaPass);
        taaComposer.addPass(copyPass);

        let ambient = new THREE.AmbientLight(0x554433, 0.6); scene.add(ambient);
        let dirLight = new THREE.DirectionalLight(0xffdd99, 1.0); dirLight.position.set(10,20,10); dirLight.castShadow = true; scene.add(dirLight);
        startRoomGroup = createStartRoom(); scene.add(startRoomGroup);

        startHintBox.addEventListener('click', startGame);
        startHintBox.addEventListener('touchstart', (e) => { e.preventDefault(); startGame(); });
        document.addEventListener('keydown', (e) => {
            let k=e.key.toLowerCase();
            if(k==='w') keyState.w=1; if(k==='s') keyState.s=1; if(k==='a') keyState.a=1; if(k==='d') keyState.d=1; if(k==='e') keyState.e=1;
            if(k==='1') switchWeapon(0); if(k==='2') switchWeapon(1); if(k==='3') switchWeapon(2);
            if(k===' '||k==='f') shoot(); if(k==='v') meleeAttack(); if(k==='l') toggleFlashlight();
        });
        document.addEventListener('keyup', (e) => {
            let k=e.key.toLowerCase();
            if(k==='w') keyState.w=0; if(k==='s') keyState.s=0; if(k==='a') keyState.a=0; if(k==='d') keyState.d=0; if(k==='e') keyState.e=0;
        });
        renderer.domElement.addEventListener('mousedown', () => { mouseLookActive = true; if(gameStarted) shoot(); });
        renderer.domElement.addEventListener('mouseup', () => mouseLookActive = false);
        renderer.domElement.addEventListener('mousemove', (e) => {
            if(mouseLookActive || gameStarted) {
                cameraRotation.yaw -= e.movementX * 0.003;
                cameraRotation.pitch -= e.movementY * 0.003;
                cameraRotation.pitch = Math.max(-0.7, Math.min(0.7, cameraRotation.pitch));
            }
        });
        let touchStartX=0, touchStartY=0;
        renderer.domElement.addEventListener('touchstart', (e) => { if(e.touches.length===1) { touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY; } });
        renderer.domElement.addEventListener('touchmove', (e) => {
            if(e.touches.length===1) {
                let dx=e.touches[0].clientX-touchStartX, dy=e.touches[0].clientY-touchStartY;
                cameraRotation.yaw -= dx*0.005; cameraRotation.pitch -= dy*0.005;
                cameraRotation.pitch = Math.max(-0.7, Math.min(0.7, cameraRotation.pitch));
                touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY;
            }
        });
        const joyArea=document.getElementById('joystick-area'), thumb=document.getElementById('joystick-thumb');
        let joyCenter={x:0,y:0};
        joyArea.addEventListener('touchstart', (e) => { e.preventDefault(); let rect=joyArea.getBoundingClientRect(); joyCenter={x:rect.left+rect.width/2,y:rect.top+rect.height/2}; joystickActive=true; });
        joyArea.addEventListener('touchmove', (e) => {
            e.preventDefault(); let t=e.touches[0];
            let dx=t.clientX-joyCenter.x, dy=t.clientY-joyCenter.y;
            let len=Math.min(45,Math.hypot(dx,dy)), ang=Math.atan2(dy,dx);
            let tx=Math.cos(ang)*len, ty=Math.sin(ang)*len;
            thumb.style.transform=`translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px))`;
            joystickVec.x=tx/45; joystickVec.z=ty/45;
        });
        joyArea.addEventListener('touchend', () => { joystickActive=false; joystickVec={x:0,z:0}; thumb.style.transform='translate(-50%, -50%)'; });
        document.getElementById('shoot-btn').addEventListener('click', shoot);
        document.getElementById('melee-btn').addEventListener('click', meleeAttack);
        document.getElementById('interact-mobile-btn').addEventListener('click', () => { window.triggerInteract=true; setTimeout(()=>window.triggerInteract=false,200); });
        document.getElementById('flashlight-btn').addEventListener('click', toggleFlashlight);
        submitPasswordBtn.addEventListener('click', () => {
            let input=passwordInput.value, correct=graffitiDigits.join('')+tapeDigit;
            if(input===correct) { alert('密码正确！成功逃离后室！'); location.reload(); } else alert('密码错误！');
        });
        chatInput.addEventListener('keypress', (e) => { if(e.key==='Enter' && chatInput.value.trim()) { addChatMessage('你', chatInput.value); chatInput.value=''; } });

        // 清理远处实体
        setInterval(() => {
            if(!gameStarted) return;
            const maxDist = 80;
            smilers = smilers.filter(e => { if(camera.position.distanceTo(e.mesh.position) > maxDist) { scene.remove(e.mesh); return false; } return true; });
            mimics = mimics.filter(e => { if(camera.position.distanceTo(e.mesh.position) > maxDist) { scene.remove(e.mesh); return false; } return true; });
            dolls = dolls.filter(e => { if(camera.position.distanceTo(e.mesh.position) > maxDist) { scene.remove(e.mesh); return false; } return true; });
            shadows = shadows.filter(e => { if(camera.position.distanceTo(e.mesh.position) > maxDist) { scene.remove(e.mesh); return false; } return true; });
        }, 5000);

        function updateMovement(delta) {
            if(!gameStarted) return;
            let moveX=0, moveZ=0;
            if(keyState.w) moveZ-=1; if(keyState.s) moveZ+=1; if(keyState.a) moveX-=1; if(keyState.d) moveX+=1;
            if(joystickActive) { moveX=joystickVec.x; moveZ=joystickVec.z; }
            if(moveX!==0 || moveZ!==0) {
                let speed=7; if(stamina<20) speed*=0.6;
                let forward=new THREE.Vector3(-Math.sin(cameraRotation.yaw),0,-Math.cos(cameraRotation.yaw));
                let right=new THREE.Vector3(Math.cos(cameraRotation.yaw),0,-Math.sin(cameraRotation.yaw));
                let vel=new THREE.Vector3().addScaledVector(forward,moveZ).addScaledVector(right,moveX).normalize();
                camera.position.x += vel.x * speed * delta;
                camera.position.z += vel.z * speed * delta;
                let dx=camera.position.x-lastPosition.x, dz=camera.position.z-lastPosition.z;
                currentDistance += Math.sqrt(dx*dx+dz*dz);
                lastPosition.x=camera.position.x; lastPosition.z=camera.position.z;
                stamina = Math.max(0, stamina - delta*12);
            } else stamina = Math.min(100, stamina + delta*8);
        }
        function updateSanity(delta) {
            let closest=999;
            for(let e of smilers) closest=Math.min(closest, camera.position.distanceTo(e.mesh.position));
            for(let e of mimics) closest=Math.min(closest, camera.position.distanceTo(e.mesh.position));
            for(let e of dolls) closest=Math.min(closest, camera.position.distanceTo(e.mesh.position));
            for(let e of shadows) closest=Math.min(closest, camera.position.distanceTo(e.mesh.position));
            if(closest<15) sanity=Math.max(0,sanity-delta*6);
            else if(sanity<100) sanity=Math.min(100,sanity+delta*3);
            updateUI();
        }

        let lastRenderTime=0;
        function animate(now) {
            requestAnimationFrame(animate);
            let delta=Math.min(0.033,(now-lastRenderTime)/1000);
            if(delta<=0) { lastRenderTime=now; return; }
            lastRenderTime=now;
            updateMovement(delta);
            if(gameStarted) {
                updateChunks();
                smilers.forEach(e=>e.update(delta,camera.position));
                mimics.forEach(e=>e.update(delta,camera.position));
                dolls.forEach(e=>e.update(delta,camera.position));
                shadows.forEach(e=>e.update(delta,camera.position));
                checkSpawning(); updateSanity(delta);
                soundEvents=soundEvents.filter(ev=>(now/1000-ev.time)<2);
                if(dustParticles) {
                    let pos=dustParticles.geometry.attributes.position.array;
                    for(let i=0;i<pos.length;i+=3) { pos[i+1]+=Math.sin(now*0.001+i)*0.0002; pos[i]+=Math.cos(now*0.001+i*0.5)*0.0001; pos[i+2]+=Math.sin(now*0.001+i*0.3)*0.0001; }
                    dustParticles.geometry.attributes.position.needsUpdate=true;
                }
                if(flashlightLight) {
                    flashlightLight.position.copy(camera.position); flashlightLight.position.y+=0.1;
                    let targetPos=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion).add(camera.position);
                    flashlightLight.target.position.copy(targetPos);
                }
            }
            handleInteractions();
            camera.rotation.order='YXZ'; camera.rotation.y=cameraRotation.yaw; camera.rotation.x=cameraRotation.pitch;
            taaComposer.render();
            renderer.copyFramebufferToTexture(taaComposer.renderTarget1 ? taaComposer.renderTarget1 : null, rtPrev.texture);
        }

        window.addEventListener('resize', () => {
            camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth,window.innerHeight);
            taaComposer.setSize(window.innerWidth,window.innerHeight);
            taaPass.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
            rtPrev.setSize(window.innerWidth, window.innerHeight);
        });

        setTimeout(() => { loadingDiv.classList.add('hidden'); setTimeout(() => loadingDiv.style.display='none', 800); }, 800);
        requestAnimationFrame(animate);
    } catch(err) { console.error(err); alert("游戏启动失败: "+err.message); }
}

const orientationTip = document.getElementById('orientation-tip');
function checkOrientation() { orientationTip.style.display = window.innerHeight > window.innerWidth ? 'flex' : 'none'; }
window.addEventListener('resize', checkOrientation);
checkOrientation();
</script>
</body>
