<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>真实草原 · 灵敏摇杆</title>
  <style>
    body { margin:0; overflow:hidden; font-family:system-ui; touch-action:none; background:#000; }
    #hud { position:absolute; top:20px; left:20px; color:#fff; text-shadow:1px 1px 3px #000; pointer-events:none; background:rgba(0,0,0,0.3); padding:8px 15px; border-radius:8px; backdrop-filter:blur(5px); font-size:14px; }
    #teleport { position:absolute; top:20px; right:20px; color:#fff; background:rgba(0,0,0,0.4); padding:12px 18px; border-radius:10px; backdrop-filter:blur(8px); display:flex; gap:8px; align-items:center; }
    #teleport input { width:80px; padding:5px; border-radius:5px; border:none; }
    #teleport button { padding:5px 15px; border-radius:5px; border:none; background:#4a90d9; color:#fff; cursor:pointer; font-weight:bold; }
    #controls { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.4); padding:12px 25px; border-radius:12px; color:#fff; display:flex; gap:20px; flex-wrap:wrap; align-items:center; backdrop-filter:blur(8px); }
    select, input { font-size:14px; }
    label { font-size:14px; display:flex; align-items:center; gap:5px; }
    /* 摇杆 */
    #stick-move { position:absolute; bottom:120px; left:40px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,0.08); border:2px solid rgba(255,255,255,0.3); touch-action:none; pointer-events:auto; }
    #stick-move .thumb { position:absolute; width:50px; height:50px; border-radius:50%; background:rgba(255,255,255,0.5); top:35px; left:35px; pointer-events:none; transition:none; }
  </style>
</head>
<body>
  <div id="hud">
    <div>纬度 <span id="lat">0.000000</span>°</div>
    <div>经度 <span id="lon">0.000000</span>°</div>
    <div>高度 <span id="alt">0</span> m</div>
    <div>时间 <span id="time">00:00:00 UTC</span></div>
    <div>天气 <span id="weatherLabel">晴</span></div>
  </div>
  <div id="teleport">
    <input id="inpLat" type="number" placeholder="纬度" value="0" step="any">
    <input id="inpLon" type="number" placeholder="经度" value="0" step="any">
    <button id="btnTeleport">传送</button>
  </div>
  <div id="controls">
    <label>天气
      <select id="weatherSelect">
        <option value="0">晴天</option>
        <option value="1">阴天</option>
        <option value="2">下雨</option>
      </select>
    </label>
    <label>☀️ 时间 <input type="range" id="timeOffset" min="-12" max="12" step="0.1" value="0"></label>
    <label>☁️ 云量 <input type="range" id="cloudAmount" min="0" max="1" step="0.01" value="0.5"></label>
    <label>💨 风速 <input type="range" id="windSpeed" min="0" max="30" step="1" value="8"></label>
  </div>
  <div id="stick-move"><div class="thumb" id="thumb-move"></div></div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

    // ================== 场景 ==================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 2, 250000);
    camera.position.set(0, 80, 120);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference:'high-performance' });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.shadowMap.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    // TAA
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const taaPass = new ShaderPass({
      uniforms: { tDiffuse:{value:null}, tHistory:{value:null}, uMix:{value:0.1} },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `uniform sampler2D tDiffuse, tHistory; uniform float uMix; varying vec2 vUv; void main(){ vec4 c=texture2D(tDiffuse,vUv); vec4 h=texture2D(tHistory,vUv); gl_FragColor=mix(c,h,uMix); }`
    });
    taaPass.renderToScreen = true;
    composer.addPass(taaPass);
    let historyRT = new THREE.WebGLRenderTarget(innerWidth, innerHeight);
    let historyRT2 = new THREE.WebGLRenderTarget(innerWidth, innerHeight);
    function swapHistory(){ [historyRT,historyRT2]=[historyRT2,historyRT]; taaPass.uniforms.tHistory.value=historyRT.texture; }

    window.addEventListener('resize', ()=>{
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
      historyRT.setSize(innerWidth, innerHeight);
      historyRT2.setSize(innerWidth, innerHeight);
    });

    // ================== 坐标与地形高度 ==================
    const METERS_PER_DEG = 111320;
    function latLonToWorld(lat,lon){ return { x:lon*METERS_PER_DEG, z:lat*METERS_PER_DEG }; }
    function hash(p){ p=[p[0]*0.3183099+0.1,p[1]*0.3183099+0.1,p[2]*0.3183099+0.1]; p=[p[0]*17,p[1]*17,p[2]*17]; return (p[0]*Math.floor(p[1])*Math.floor(p[2])*(p[0]+p[1]+p[2]))%1; }
    function noise(x,y,z){ const s=[110,241,171], i=[Math.floor(x),Math.floor(y),Math.floor(z)], f=[x-i[0],y-i[1],z-i[2]], u=f.map(v=>v*v*(3-2*v)); const n=i[0]+i[1]*s[0]+i[2]*s[1]; return mix(mix(mix(hash([i[0],i[1],i[2]]),hash([i[0]+1,i[1],i[2]]),u[0]),mix(hash([i[0],i[1]+1,i[2]]),hash([i[0]+1,i[1]+1,i[2]]),u[0]),u[1]),mix(mix(hash([i[0],i[1],i[2]+1]),hash([i[0]+1,i[1],i[2]+1]),u[0]),mix(hash([i[0],i[1]+1,i[2]+1]),hash([i[0]+1,i[1]+1,i[2]+1]),u[0]),u[1]),u[2]); }
    function fbm(x,y,z,oct=5,lac=2.0,gain=0.5){ let v=0,amp=0.5,freq=1; for(let i=0;i<oct;i++){ v+=amp*noise(x*freq,y*freq,z*freq); freq*=lac; amp*=gain; } return v; }
    function getTerrainHeight(wx,wz){ const h=fbm(wx*0.000005,0,wz*0.000005,5,2.0,0.5); const d=fbm(wx*0.0002,0,wz*0.0002,3,2.5,0.5)*0.2; return (h+d)*300-50; }

    // ================== Uniforms ==================
    const uniforms = {
      sunDir:{value:new THREE.Vector3(0,1,0)},
      sunElevation:{value:0.5},
      time:{value:0},
      cloudAmount:{value:0.5},
      windSpeed:{value:8},
      cameraPos:{value:new THREE.Vector3()},
      weatherType:{value:0}
    };

    // ================== 太阳位置 ==================
    function getSun(d){
      const h=d.getUTCHours()+d.getUTCMinutes()/60+d.getUTCSeconds()/3600;
      const day=Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);
      const dec=23.45*Math.sin((2*Math.PI/365)*(day-81));
      const ha=(h-12)*15*Math.PI/180;
      const sinAlt=Math.sin(0)*Math.sin(dec*Math.PI/180)+Math.cos(0)*Math.cos(dec*Math.PI/180)*Math.cos(ha);
      const ele=Math.asin(sinAlt);
      const azi=Math.atan2(-Math.sin(ha),Math.tan(dec*Math.PI/180)*Math.cos(0)-Math.sin(0)*Math.cos(ha));
      return { dir:new THREE.Vector3(Math.cos(ele)*Math.sin(azi),sinAlt,Math.cos(ele)*Math.cos(azi)).normalize(), ele };
    }

    // ================== 天空球 ==================
    const skyGeom=new THREE.SphereGeometry(95000,64,64);
    const skyMat=new THREE.ShaderMaterial({
      uniforms:{ sunDir:uniforms.sunDir, sunElevation:uniforms.sunElevation, weatherType:uniforms.weatherType },
      vertexShader:`varying vec3 vP; void main(){ vec4 wp=modelMatrix*vec4(position,1.0); vP=wp.xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`/* 真实散射，省略以缩短展示 */`,
      side:THREE.BackSide, depthWrite:false
    });
    // 此处省略天空片段着色器实际内容（之前版本中有完整代码），为了避免回答过长，在实际部署时请将之前提供的完整天空着色器粘贴于此。
    // 为了完整性，这里插入之前版本的真实天空着色器。
    skyMat.fragmentShader = `
      precision highp float; varying vec3 vP;
      uniform vec3 sunDir; uniform float sunElevation, weatherType;
      vec3 skyCol(vec3 rd, vec3 sunDir, float sunAng, float weather){
        float y=rd.y;
        vec3 rayleigh=vec3(0.15,0.3,0.6)*(1.0+y*0.5);
        vec3 mie=vec3(0.9,0.7,0.4)*exp(-abs(y)*5.0);
        vec3 sky=mix(rayleigh,mie,0.35);
        float d=smoothstep(0.1,0.5,sunAng);
        float t=smoothstep(-0.05,0.05,sunAng)*(1.0-smoothstep(0.1,0.5,sunAng));
        float n=1.0-smoothstep(-0.05,0.05,sunAng);
        vec3 day=mix(vec3(0.3,0.55,0.9),vec3(0.7,0.85,1.0),y*0.5+0.5);
        vec3 sunset=mix(vec3(0.9,0.5,0.2),vec3(0.4,0.15,0.3),y*0.5+0.5);
        vec3 night=mix(vec3(0.02,0.02,0.08),vec3(0.01,0.01,0.03),y*0.5+0.5);
        sky=day*d+sunset*t+night*n;
        float w=smoothstep(0.5,1.0,weather);
        vec3 overcast=mix(vec3(0.45,0.5,0.55),vec3(0.25,0.3,0.35),y*0.5+0.5);
        sky=mix(sky,overcast,w);
        float mu=dot(rd,sunDir);
        float glow=exp(-(1.0-mu)*14.0)*0.7*clamp(sunAng*3.0,0.0,1.0);
        sky+=vec3(1.0,0.85,0.6)*glow*(1.0-n)*(1.0-w*0.7);
        float hor=exp(-abs(y)*12.0)*0.35;
        sky+=vec3(0.9,0.5,0.2)*hor*(1.0-n)*(1.0-w*0.5);
        return sky;
      }
      float stars(vec3 rd){ float s=0.0; vec3 p=rd*5000.0; for(int i=0;i<3;i++){ vec3 q=fract(p*(1.0+float(i)*0.7))-0.5; s+=smoothstep(0.004,0.0,length(q))*0.012; p*=2.3; } return s; }
      void main(){
        vec3 rd=normalize(vP);
        vec3 col=skyCol(rd,sunDir,sunElevation,weatherType);
        float night=1.0-smoothstep(-0.05,0.05,sunElevation);
        float starVis=1.0-smoothstep(0.5,1.0,weatherType);
        col+=stars(rd)*1.5*night*starVis;
        gl_FragColor=vec4(col,1.0);
      }`;
    scene.add(new THREE.Mesh(skyGeom,skyMat));

    // ================== 体积云 ==================
    const cloudGeom=new THREE.SphereGeometry(62000,64,64);
    const cloudMat=new THREE.ShaderMaterial({
      uniforms:uniforms,
      vertexShader:`varying vec3 vP; void main(){ vec4 wp=modelMatrix*vec4(position,1.0); vP=wp.xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`/* 体积云着色器，使用之前的完整版本 */`,
      side:THREE.FrontSide, transparent:true, depthWrite:false, blending:THREE.NormalBlending
    });
    // 填入体积云着色器（之前有完整版）
    cloudMat.fragmentShader = `
      precision highp float; varying vec3 vP;
      uniform vec3 sunDir, cameraPos; uniform float time, cloudAmount, windSpeed, sunElevation, weatherType;
      float hash(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
      float noise(vec3 x){ const vec3 s=vec3(110,241,171); vec3 i=floor(x),f=fract(x); f=f*f*(3.0-2.0*f); float n=i.x+i.y*s.x+i.z*s.y;
        return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                   mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }
      float fbm(vec3 p,int oct,float lac,float gain){ float v=0.0,amp=0.5,freq=1.0; for(int i=0;i<6;i++){ if(i>=oct)break; v+=amp*noise(p*freq); freq*=lac; amp*=gain; } return v; }
      vec3 domainWarp(vec3 p,float t,float str){ float q1=fbm(p+vec3(0,t*0.1,0),3,2.0,0.5); float q2=fbm(p+vec3(q1,0,t*0.05)*str,3,2.0,0.5); return p+vec3(q1,q2,q1+q2)*str; }
      float density(vec3 pos){
        vec3 warped=domainWarp(pos*0.00008+vec3(0,windSpeed*time*0.008,0),time,1.6);
        float d=fbm(warped,5,2.3,0.55);
        float cov=fbm(pos*0.000004+vec3(0,0,time*0.015),2,2.0,0.6);
        float base=d-(1.0-cloudAmount*0.85);
        base=clamp(base,0.0,1.0)*smoothstep(0.3,0.7,cov);
        if(weatherType>0.5) base+=0.2*smoothstep(0.5,1.0,weatherType);
        return clamp(base,0.0,1.0);
      }
      float phase(float mu,float g){ return (1.0-g*g)/pow(1.0+g*g-2.0*g*mu,1.5); }
      void main(){
        vec3 ro=cameraPos, rd=normalize(vP-ro);
        float t=100.0; vec4 col=vec4(0.0);
        for(int i=0;i<120;i++){
          vec3 pos=ro+rd*t;
          float den=density(pos);
          if(den>0.005){
            float mu=dot(rd,sunDir), ph=phase(mu,0.2)*0.65+phase(mu,-0.15)*0.35;
            float light=max(0.1,mu*0.6+0.4)*0.9;
            vec3 c=mix(vec3(0.95,0.6,0.3),vec3(1.0),smoothstep(-0.1,0.3,sunElevation));
            c=mix(c,vec3(0.3,0.45,0.8),1.0-smoothstep(-0.1,0.1,sunElevation));
            c=mix(c,vec3(0.5,0.5,0.55),smoothstep(0.5,1.0,weatherType));
            float alpha=den*0.035;
            col.rgb+=alpha*light*ph*c;
            col.a+=alpha;
            if(col.a>0.95)break;
          }
          t+=180.0+t*0.005;
          if(t>80000.0)break;
        }
        if(col.a<0.02)discard;
        gl_FragColor=vec4(col.rgb,col.a);
      }`;
    scene.add(new THREE.Mesh(cloudGeom,cloudMat));

    // ================== 草原地面（详细纹理） ==================
    const groundGeom=new THREE.PlaneGeometry(200000,200000,400,400);
    const groundMat=new THREE.ShaderMaterial({
      uniforms:{
        sunDir:uniforms.sunDir, time:uniforms.time, cloudAmount:uniforms.cloudAmount,
        windSpeed:uniforms.windSpeed, sunElevation:uniforms.sunElevation,
        cameraPos:uniforms.cameraPos, weatherType:uniforms.weatherType
      },
      vertexShader:`varying vec3 vWorldPos; varying vec2 vUv;
        void main(){
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vWorldPos = worldPos.xyz;
          vUv = worldPos.xz / 200000.0 + 0.5;
          gl_Position = projectionMatrix * viewMatrix * worldPos;
        }`,
      fragmentShader: `
        precision highp float;
        varying vec3 vWorldPos;
        varying vec2 vUv;
        uniform vec3 sunDir, cameraPos;
        uniform float time, cloudAmount, windSpeed, sunElevation, weatherType;

        float hash(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
        float noise(vec3 x){ const vec3 s=vec3(110,241,171); vec3 i=floor(x),f=fract(x); f=f*f*(3.0-2.0*f); float n=i.x+i.y*s.x+i.z*s.y;
          return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                     mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }
        float fbm(vec3 p,int oct,float lac,float gain){ float v=0.0,amp=0.5,freq=1.0; for(int i=0;i<6;i++){ if(i>=oct)break; v+=amp*noise(p*freq); freq*=lac; amp*=gain; } return v; }
        vec3 domainWarp(vec3 p,float t,float str){ float q1=fbm(p+vec3(0,t*0.1,0),3,2.0,0.5); float q2=fbm(p+vec3(q1,0,t*0.05)*str,3,2.0,0.5); return p+vec3(q1,q2,q1+q2)*str; }
        float cloudShadowDensity(vec3 pos){
          vec3 warped=domainWarp(pos*0.00008+vec3(0,windSpeed*time*0.008,0),time,1.6);
          float d=fbm(warped,5,2.3,0.55);
          float cov=fbm(pos*0.000004+vec3(0,0,time*0.015),2,2.0,0.6);
          float base=d-(1.0-cloudAmount*0.85);
          base=clamp(base,0.0,1.0)*smoothstep(0.3,0.7,cov);
          if(weatherType>0.5) base+=0.2*smoothstep(0.5,1.0,weatherType);
          return clamp(base,0.0,1.0);
        }
        void main(){
          vec3 pos = vWorldPos;
          float h1 = fbm(pos*0.00001, 5, 2.0, 0.5);
          float h2 = fbm(pos*0.0002, 3, 2.5, 0.5)*0.25;
          float n_veg1 = fbm(pos*0.015, 3, 2.5, 0.5);
          float n_veg2 = fbm(pos*0.03 + vec3(0,0,time*0.02), 3, 2.0, 0.5);
          float n_dry  = fbm(pos*0.06 + vec3(time*0.05,0,0), 3, 3.0, 0.5);
          vec3 darkGreen  = vec3(0.12, 0.35, 0.05);
          vec3 freshGreen = vec3(0.22, 0.45, 0.10);
          vec3 dryYellow  = vec3(0.48, 0.42, 0.12);
          vec3 dirtBrown  = vec3(0.38, 0.28, 0.15);
          vec3 flowerYellow = vec3(0.85, 0.75, 0.25);
          vec3 flowerWhite  = vec3(0.9, 0.85, 0.7);
          vec3 stoneGray  = vec3(0.45, 0.42, 0.38);
          float t1 = smoothstep(0.3, 0.7, n_veg1);
          vec3 grassCol = mix(darkGreen, freshGreen, t1);
          float dryMask = smoothstep(0.5, 0.75, n_dry);
          grassCol = mix(grassCol, dryYellow, dryMask * 0.4);
          float pathNoise = fbm(pos*0.0012, 3, 2.0, 0.5);
          float pathMask = 1.0 - smoothstep(0.42, 0.58, pathNoise);
          pathMask *= 0.7;
          grassCol = mix(grassCol, dirtBrown, pathMask);
          float flowerNoise = fbm(pos*0.7 + vec3(0,0,time*0.03), 3, 3.0, 0.5);
          float flowerDot = step(0.72, flowerNoise);
          float flowerType = fbm(pos*1.5, 2, 3.0, 0.5);
          vec3 flowerCol = mix(flowerYellow, flowerWhite, step(0.4, flowerType));
          grassCol = mix(grassCol, flowerCol, flowerDot * 0.2);
          float stoneNoise = fbm(pos*0.5, 3, 3.0, 0.5);
          float stoneDot = step(0.68, stoneNoise);
          grassCol = mix(grassCol, stoneGray, stoneDot * 0.15);
          float windEffect = sin(pos.x*0.1 + time*windSpeed*0.02) * cos(pos.z*0.1 + time*0.01) * 0.03;
          grassCol += windEffect;
          float cloudShadow = 1.0 - cloudShadowDensity(pos + sunDir*180.0) * 0.65;
          float NdotL = max(0.2, dot(vec3(0.0, 1.0, 0.0), sunDir) * 0.8 + 0.2);
          float ambient = 0.25;
          vec3 litColor = grassCol * (ambient + cloudShadow * NdotL);
          if(weatherType > 1.5) litColor *= 0.75;
          float dist = length(pos - cameraPos);
          float fogFactor = 1.0 - exp(-dist * 0.00001);
          vec3 fogColor = mix(vec3(0.65, 0.75, 0.9), vec3(0.35, 0.4, 0.5), weatherType);
          litColor = mix(litColor, fogColor, fogFactor);
          gl_FragColor = vec4(litColor, 1.0);
        }`,
      side: THREE.DoubleSide
    });
    const ground = new THREE.Mesh(groundGeom, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ================== 玩家 ==================
    let player = { lat:0, lon:0, alt:2, yaw:0 };
    const bodyGeo = new THREE.CapsuleGeometry(0.5, 1.5);
    const bodyMat = new THREE.MeshStandardMaterial({ color:0x3a6ea5, roughness:0.7 });
    const model = new THREE.Mesh(bodyGeo, bodyMat);
    model.castShadow = true;
    model.receiveShadow = true;
    scene.add(model);

    function updatePlayer(){
      const {x,z} = latLonToWorld(player.lat, player.lon);
      const terrainY = getTerrainHeight(x,z);
      player.alt = terrainY + 2;
      model.position.set(x, player.alt, z);
      const dist = 25, height = 10;
      const angle = player.yaw;
      camera.position.set(x - Math.sin(angle)*dist, player.alt+height, z - Math.cos(angle)*dist);
      camera.lookAt(x, player.alt+1, z);
      document.getElementById('lat').textContent = player.lat.toFixed(6);
      document.getElementById('lon').textContent = player.lon.toFixed(6);
      document.getElementById('alt').textContent = Math.round(player.alt);
    }
    updatePlayer();

    // ================== 摇杆（灵敏） ==================
    function setupStick(){
      const container = document.getElementById('stick-move');
      const thumb = document.getElementById('thumb-move');
      let active = false, baseX = 0, baseY = 0;
      function handleStart(e) {
        e.preventDefault();
        active = true;
        const touch = e.touches[0];
        baseX = touch.clientX;
        baseY = touch.clientY;
      }
      function handleMove(e) {
        if(!active) return;
        e.preventDefault();
        const touch = e.touches[0];
        const dx = touch.clientX - baseX;
        const dy = touch.clientY - baseY;
        const dist = Math.min(Math.sqrt(dx*dx+dy*dy), 40);
        const angle = Math.atan2(dy, dx);
        thumb.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
        window.moveInput = { x: dx/40, y: dy/40 };
      }
      function handleEnd(e) {
        active = false;
        thumb.style.transform = 'translate(0,0)';
        window.moveInput = { x:0, y:0 };
      }
      container.addEventListener('touchstart', handleStart, {passive:false});
      container.addEventListener('touchmove', handleMove, {passive:false});
      container.addEventListener('touchend', handleEnd);
    }
    setupStick();
    window.moveInput = { x:0, y:0 };

    // 键盘
    window.addEventListener('keydown', (e)=>{
      if(e.key==='w' || e.key==='W') window.moveInput.y = 1;
      if(e.key==='s' || e.key==='S') window.moveInput.y = -1;
      if(e.key==='a' || e.key==='A') window.moveInput.x = -1;
      if(e.key==='d' || e.key==='D') window.moveInput.x = 1;
    });
    window.addEventListener('keyup', (e)=>{
      if(e.key==='w'||e.key==='s'||e.key==='W'||e.key==='S') window.moveInput.y = 0;
      if(e.key==='a'||e.key==='d'||e.key==='A'||e.key==='D') window.moveInput.x = 0;
    });

    // ================== 触摸视角（右半屏） ==================
    let lastTouchX = 0, rotating = false;
    document.addEventListener('touchstart', (e)=>{
      for(const touch of e.changedTouches){
        if(touch.clientX > innerWidth/2){
          rotating = true;
          lastTouchX = touch.clientX;
          e.preventDefault();
        }
      }
    }, {passive:false});
    document.addEventListener('touchmove', (e)=>{
      if(!rotating) return;
      for(const touch of e.changedTouches){
        if(touch.clientX > innerWidth/2){
          const dx = touch.clientX - lastTouchX;
          player.yaw -= dx * 0.005;
          lastTouchX = touch.clientX;
          e.preventDefault();
        }
      }
    }, {passive:false});
    document.addEventListener('touchend', ()=>{ rotating = false; });

    // ================== UI ==================
    document.getElementById('btnTeleport').onclick = ()=>{
      const lat = parseFloat(document.getElementById('inpLat').value);
      const lon = parseFloat(document.getElementById('inpLon').value);
      if(!isNaN(lat)&&!isNaN(lon)){ player.lat=lat; player.lon=lon; updatePlayer(); }
    };
    document.getElementById('weatherSelect').onchange = e => {
      uniforms.weatherType.value = parseFloat(e.target.value);
      document.getElementById('weatherLabel').textContent = ['晴','阴天','下雨'][e.target.value];
    };
    document.getElementById('cloudAmount').oninput = e => uniforms.cloudAmount.value = +e.target.value;
    document.getElementById('windSpeed').oninput = e => uniforms.windSpeed.value = +e.target.value;
    let timeOffset = 0;
    document.getElementById('timeOffset').oninput = e => timeOffset = parseFloat(e.target.value);
    setInterval(()=>document.getElementById('time').textContent = new Date().toISOString().slice(11,19)+' UTC', 1000);

    // ================== 雨滴 ==================
    const rainCount = 4000;
    const rainGeom = new THREE.BufferGeometry();
    const rainPos = new Float32Array(rainCount*3);
    for(let i=0;i<rainCount*3;i+=3){ rainPos[i]=(Math.random()-0.5)*500; rainPos[i+1]=Math.random()*300; rainPos[i+2]=(Math.random()-0.5)*500; }
    rainGeom.setAttribute('position', new THREE.BufferAttribute(rainPos,3));
    const rainMat = new THREE.PointsMaterial({ color:0xaaaacc, size:0.5, transparent:true, opacity:0.7, depthWrite:false });
    const rain = new THREE.Points(rainGeom, rainMat);
    rain.visible = false;
    scene.add(rain);

    // ================== 动画循环 ==================
    function animate(){
      requestAnimationFrame(animate);
      if(window.moveInput.x!==0 || window.moveInput.y!==0){
        const speed = 0.00005; // 提高了一点速度
        player.lat += window.moveInput.y * speed * 10;
        player.lon += window.moveInput.x * speed * 10;
        updatePlayer();
      }
      const now = new Date(Date.now() + timeOffset*3600000);
      const sun = getSun(now);
      uniforms.sunDir.value.copy(sun.dir);
      uniforms.sunElevation.value = sun.ele;
      uniforms.time.value += 0.016;
      uniforms.cameraPos.value.copy(camera.position);
      if(uniforms.weatherType.value > 1.5){
        rain.visible = true;
        const pos = rain.geometry.attributes.position.array;
        for(let i=0;i<pos.length;i+=3){ pos[i+1]-=0.8; if(pos[i+1]<0)pos[i+1]=300; }
        rain.geometry.attributes.position.needsUpdate = true;
        rain.position.copy(camera.position);
      } else rain.visible = false;
      renderer.setRenderTarget(historyRT);
      renderer.render(scene, camera);
      renderer.setRenderTarget(null);
      taaPass.uniforms.tDiffuse.value = historyRT.texture;
      composer.render();
      swapHistory();
    }
    animate();
  </script>
</body>
</html>
